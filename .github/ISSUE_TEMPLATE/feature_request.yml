name: Feature request
description: Suggest an idea
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Lumen to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why do you need it?
      description: What are you trying to do that is hard right now?
  - type: dropdown
    id: os
    attributes:
      label: Which system do you use?
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
