name: CI

on:
  push:
    branches: [ rust-dev ]
  pull_request:
    branches: [ rust-dev, rust ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint Suite (Linux x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev protobuf-compiler

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend --engine-strict=false

      - name: Frontend Tests, Lint & Build Check
        run: |
          npm test --prefix frontend
          npm run lint --prefix frontend
          npm run build --prefix frontend

      - name: Run Workspace Tests
        run: cargo test --workspace

      - name: Run Workspace Clippy
        run: cargo clippy --workspace --all-targets

  build-dev-linux:
    name: Build Linux Dev Artifacts (x64)
    if: github.event_name != 'pull_request'
    needs: [test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev protobuf-compiler

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend --engine-strict=false

      - name: Build Frontend
        run: npm run build --prefix frontend

      - name: Build Tauri Bundles (.deb & AppImage)
        working-directory: crates/lumen-tauri
        run: npx --prefix ../../frontend tauri build --debug --bundles appimage,deb

      - name: Build Standalone Linux CLI
        run: cargo build -p lumen-cli --bin lumen-cli

      - name: Stage Dev Artifacts
        shell: bash
        run: |
          CARGO_VER=$(grep -m1 '^version =' crates/lumen-tauri/Cargo.toml | cut -d '"' -f2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          V="${CARGO_VER}-dev.${SHORT_SHA}"
          mkdir -p dist
          shopt -s nullglob

          # 1. AppImage
          APPIMAGE=""
          for f in target/debug/bundle/appimage/*.AppImage target/release/bundle/appimage/*.AppImage; do
            APPIMAGE="$f"
            break
          done
          if [ -n "$APPIMAGE" ] && [ -f "$APPIMAGE" ]; then
            cp "$APPIMAGE" "dist/lumen_${V}_linux_x64.AppImage"
            chmod +x "dist/lumen_${V}_linux_x64.AppImage"
          else
            echo "Error: Missing AppImage artifact."
            exit 1
          fi

          # 2. Debian / Ubuntu .deb
          DEB_FILE=""
          for f in target/debug/bundle/deb/*.deb target/release/bundle/deb/*.deb; do
            DEB_FILE="$f"
            break
          done
          if [ -n "$DEB_FILE" ] && [ -f "$DEB_FILE" ]; then
            cp "$DEB_FILE" "dist/lumen_${V}_linux_x64.deb"
          else
            echo "Error: Missing .deb artifact."
            exit 1
          fi

          # 3. Standalone GUI binary
          GUI_BIN=""
          for f in target/debug/lumen target/release/lumen; do
            if [ -f "$f" ]; then
              GUI_BIN="$f"
              break
            fi
          done
          if [ -n "$GUI_BIN" ]; then
            cp "$GUI_BIN" "dist/lumen_${V}_linux_x64"
            chmod +x "dist/lumen_${V}_linux_x64"
          else
            echo "Error: Missing standalone lumen binary."
            exit 1
          fi

          # 4. Standalone CLI binary
          CLI_BIN=""
          for f in target/debug/lumen-cli target/release/lumen-cli; do
            if [ -f "$f" ]; then
              CLI_BIN="$f"
              break
            fi
          done
          if [ -n "$CLI_BIN" ]; then
            cp "$CLI_BIN" "dist/lumen-cli_${V}_linux_x64"
            chmod +x "dist/lumen-cli_${V}_linux_x64"
          else
            echo "Error: Missing standalone lumen-cli binary."
            exit 1
          fi

          ls -la dist/

      - name: Upload Dev Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumen-dev-linux-x64
          path: dist/*
          retention-days: 7

  build-dev-macos:
    name: Build macOS Dev Artifacts (Universal)
    if: github.event_name != 'pull_request'
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend --engine-strict=false

      - name: Build Frontend
        run: npm run build --prefix frontend

      - name: Build Tauri Universal Bundle (.app & .dmg)
        working-directory: crates/lumen-tauri
        run: npx --prefix ../../frontend tauri build --debug --target universal-apple-darwin --bundles app,dmg

      - name: Build Standalone Universal CLI
        run: |
          cargo build -p lumen-cli --bin lumen-cli --target x86_64-apple-darwin
          cargo build -p lumen-cli --bin lumen-cli --target aarch64-apple-darwin

      - name: Stage Dev Artifacts
        shell: bash
        run: |
          CARGO_VER=$(grep -m1 '^version =' crates/lumen-tauri/Cargo.toml | cut -d '"' -f2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          V="${CARGO_VER}-dev.${SHORT_SHA}"
          mkdir -p dist
          shopt -s nullglob

          # 1. Universal DMG installer
          python3 -m pip install --break-system-packages --require-hashes -r scripts/dmg-requirements.txt || python3 -m pip install --require-hashes -r scripts/dmg-requirements.txt
          APP_PATH=""
          for p in target/universal-apple-darwin/debug/bundle/macos/Lumen.app target/universal-apple-darwin/release/bundle/macos/Lumen.app; do
            if [ -d "$p" ]; then
              APP_PATH="$p"
              break
            fi
          done
          OUT_DMG="dist/lumen_${V}_macos_universal.dmg"

          if [ -d "$APP_PATH" ]; then
            echo "Building styled DMG with dmgbuild..."
            python3 -m dmgbuild -s scripts/dmg_settings.py -D app="$APP_PATH" -D repo_root="$PWD" "Lumen" "$OUT_DMG" || true
          fi

          if [ ! -f "$OUT_DMG" ]; then
            echo "Warning: dmgbuild failed, falling back to Tauri DMG..."
            DMG_FILE=""
            for f in target/universal-apple-darwin/debug/bundle/dmg/*.dmg target/universal-apple-darwin/release/bundle/dmg/*.dmg target/universal-apple-darwin/*.dmg; do
              DMG_FILE="$f"
              break
            done
            if [ -n "$DMG_FILE" ] && [ -f "$DMG_FILE" ]; then
              cp "$DMG_FILE" "$OUT_DMG"
            else
              echo "Error: Failed to produce DMG installer."
              exit 1
            fi
          fi

          # 2. Universal .app zip bundle
          if [ -d "$APP_PATH" ]; then
            APP_DIR=$(dirname "$APP_PATH")
            (cd "$APP_DIR" && zip -r "../../../../../dist/lumen_${V}_macos_universal.zip" Lumen.app)
          else
            echo "Error: Missing Lumen.app bundle."
            exit 1
          fi

          # 3. Universal CLI binary
          CLI_X86=""
          for f in target/x86_64-apple-darwin/debug/lumen-cli target/x86_64-apple-darwin/release/lumen-cli; do
            if [ -f "$f" ]; then
              CLI_X86="$f"
              break
            fi
          done
          CLI_ARM=""
          for f in target/aarch64-apple-darwin/debug/lumen-cli target/aarch64-apple-darwin/release/lumen-cli; do
            if [ -f "$f" ]; then
              CLI_ARM="$f"
              break
            fi
          done
          if [ -f "$CLI_X86" ] && [ -f "$CLI_ARM" ]; then
            lipo -create -output "dist/lumen-cli_${V}_macos_universal" "$CLI_X86" "$CLI_ARM"
            chmod +x "dist/lumen-cli_${V}_macos_universal"
          fi

          ls -la dist/

      - name: Upload Dev Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumen-dev-macos-universal
          path: dist/*
          retention-days: 7

  build-dev-windows-x64:
    name: Build Windows Dev Artifacts (x64)
    if: github.event_name != 'pull_request'
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        shell: pwsh
        run: npm ci --prefix frontend --engine-strict=false

      - name: Build Frontend
        shell: pwsh
        run: npm run build --prefix frontend

      - name: Build Application Binaries
        shell: pwsh
        run: |
          cargo build -p lumen-tauri --bin lumen
          cargo build -p lumen-cli --bin lumen-cli

      - name: Package Custom Installer
        shell: pwsh
        run: |
          tar -czf crates/lumen-installer/payload.tar.gz -C target/debug lumen.exe lumen-cli.exe
          cargo build -p lumen-installer --bin lumen-installer

      - name: Stage Dev Artifacts
        shell: pwsh
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $CARGO_VER = (Select-String -Path crates/lumen-tauri/Cargo.toml -Pattern '^version = "(.*)"').Matches.Groups[1].Value
          $SHORT_SHA = $env:COMMIT_SHA.Substring(0, 7)
          $V = "$CARGO_VER-dev.$SHORT_SHA"
          New-Item -ItemType Directory -Force -Path dist

          # 1. Custom Setup Installer
          $INSTALLER = if (Test-Path "target/debug/lumen-installer.exe") { "target/debug/lumen-installer.exe" } else { "target/release/lumen-installer.exe" }
          if (Test-Path $INSTALLER) {
            Copy-Item -Path $INSTALLER -Destination "dist/lumen_${V}_windows_x64-setup.exe"
          } else {
            Write-Error "Missing Windows x64 installer binary."
            exit 1
          }

          # 2. Standalone GUI executable
          $GUI = if (Test-Path "target/debug/lumen.exe") { "target/debug/lumen.exe" } else { "target/release/lumen.exe" }
          if (Test-Path $GUI) {
            Copy-Item -Path $GUI -Destination "dist/lumen_${V}_windows_x64.exe"
          } else {
            Write-Error "Missing Windows x64 GUI binary."
            exit 1
          }

          # 3. Standalone CLI executable
          $CLI = if (Test-Path "target/debug/lumen-cli.exe") { "target/debug/lumen-cli.exe" } else { "target/release/lumen-cli.exe" }
          if (Test-Path $CLI) {
            Copy-Item -Path $CLI -Destination "dist/lumen-cli_${V}_windows_x64.exe"
          } else {
            Write-Error "Missing Windows x64 CLI binary."
            exit 1
          }

          Get-ChildItem -Path dist

      - name: Upload Dev Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumen-dev-windows-x64
          path: dist/*
          retention-days: 7

  build-dev-windows-arm64:
    name: Build Windows Dev Artifacts (ARM64)
    if: github.event_name != 'pull_request'
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        shell: pwsh
        run: npm ci --prefix frontend --engine-strict=false

      - name: Build Frontend
        shell: pwsh
        run: npm run build --prefix frontend

      - name: Build Application Binaries
        shell: pwsh
        run: |
          cargo build -p lumen-tauri --bin lumen --target aarch64-pc-windows-msvc
          cargo build -p lumen-cli --bin lumen-cli --target aarch64-pc-windows-msvc

      - name: Package Custom Installer
        shell: pwsh
        run: |
          tar -czf crates/lumen-installer/payload.tar.gz -C target/aarch64-pc-windows-msvc/debug lumen.exe lumen-cli.exe
          cargo build -p lumen-installer --bin lumen-installer --target aarch64-pc-windows-msvc

      - name: Stage Dev Artifacts
        shell: pwsh
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $CARGO_VER = (Select-String -Path crates/lumen-tauri/Cargo.toml -Pattern '^version = "(.*)"').Matches.Groups[1].Value
          $SHORT_SHA = $env:COMMIT_SHA.Substring(0, 7)
          $V = "$CARGO_VER-dev.$SHORT_SHA"
          New-Item -ItemType Directory -Force -Path dist

          # 1. Custom Setup Installer (ARM64)
          $INSTALLER = if (Test-Path "target/aarch64-pc-windows-msvc/debug/lumen-installer.exe") { "target/aarch64-pc-windows-msvc/debug/lumen-installer.exe" } else { "target/aarch64-pc-windows-msvc/release/lumen-installer.exe" }
          if (Test-Path $INSTALLER) {
            Copy-Item -Path $INSTALLER -Destination "dist/lumen_${V}_windows_arm64-setup.exe"
          } else {
            Write-Error "Missing Windows ARM64 installer binary."
            exit 1
          }

          # 2. Standalone GUI executable (ARM64)
          $GUI = if (Test-Path "target/aarch64-pc-windows-msvc/debug/lumen.exe") { "target/aarch64-pc-windows-msvc/debug/lumen.exe" } else { "target/aarch64-pc-windows-msvc/release/lumen.exe" }
          if (Test-Path $GUI) {
            Copy-Item -Path $GUI -Destination "dist/lumen_${V}_windows_arm64.exe"
          } else {
            Write-Error "Missing Windows ARM64 GUI binary."
            exit 1
          }

          # 3. Standalone CLI executable (ARM64)
          $CLI = if (Test-Path "target/aarch64-pc-windows-msvc/debug/lumen-cli.exe") { "target/aarch64-pc-windows-msvc/debug/lumen-cli.exe" } else { "target/aarch64-pc-windows-msvc/release/lumen-cli.exe" }
          if (Test-Path $CLI) {
            Copy-Item -Path $CLI -Destination "dist/lumen-cli_${V}_windows_arm64.exe"
          } else {
            Write-Error "Missing Windows ARM64 CLI binary."
            exit 1
          }

          Get-ChildItem -Path dist

      - name: Upload Dev Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumen-dev-windows-arm64
          path: dist/*
          retention-days: 7
