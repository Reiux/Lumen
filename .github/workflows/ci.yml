name: CI

on:
  push:
    branches: [ rust, master, main ]
  pull_request:
    branches: [ rust, master, main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint Suite (Linux x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev protobuf-compiler

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend --engine-strict=false

      - name: Frontend Tests & Build Check
        run: |
          npm test --prefix frontend
          npm run build --prefix frontend

      - name: Run Workspace Tests
        run: cargo test --workspace

      - name: Run Workspace Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build Standalone Linux CLI (Dev Build)
        run: cargo build --release -p lumen-cli --bin lumen-cli

      - name: Build Linux GUI Bundle (Dev Build)
        working-directory: crates/lumen-tauri
        run: npx --prefix ../../frontend tauri build --bundles appimage,deb

      - name: Stage Dev Artifacts
        shell: bash
        run: |
          mkdir -p dev-artifacts
          APPIMAGE=$(find target/release/bundle/appimage -name "*.AppImage" 2>/dev/null | head -n 1)
          if [ -n "$APPIMAGE" ] && [ -f "$APPIMAGE" ]; then
            cp "$APPIMAGE" dev-artifacts/lumen_dev_linux_x64.AppImage
          fi
          DEB_FILE=$(find target/release/bundle/deb -name "*.deb" 2>/dev/null | head -n 1)
          if [ -n "$DEB_FILE" ] && [ -f "$DEB_FILE" ]; then
            cp "$DEB_FILE" dev-artifacts/lumen_dev_linux_x64.deb
          fi
          if [ -f "target/release/lumen" ]; then
            cp "target/release/lumen" dev-artifacts/lumen_dev_linux_x64
          fi
          if [ -f "target/release/lumen-cli" ]; then
            cp "target/release/lumen-cli" dev-artifacts/lumen-cli_dev_linux_x64
          fi

      - name: Upload Dev Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumen-dev-linux-x64
          path: dev-artifacts/*
          retention-days: 7
