name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Typecheck & Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and Build
        working-directory: frontend
        run: npm run build

      - name: Run Unit Tests
        working-directory: frontend
        run: npm run test

  backend:
    name: Backend (Vet, Test & Cross-Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Stub frontend dist for Go embed
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Unit Tests
        run: go test -v ./...

      - name: Check CLI Cross-Compilation
        run: |
          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags cli -trimpath -o /dev/null
          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags cli -trimpath -o /dev/null
          # Windows AMD64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags cli -trimpath -o /dev/null
          # macOS ARM64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags cli -trimpath -o /dev/null
          # macOS AMD64
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -tags cli -trimpath -o /dev/null
