name: Build Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from (leave blank for current branch)"
        required: false
        default: ""
        type: string
      commit_sha:
        description: "Specific commit SHA to build (optional, overrides branch)"
        required: false
        type: string
      build_debug:
        description: "Also build debug version"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*" # Created by Release Please when the release PR is merged

permissions:
  contents: write

env:
  WAILS_VERSION: v3.0.0-beta.21

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || (inputs.commit_sha || (inputs.branch != '' && inputs.branch) || github.ref) }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install nfpm (Linux)
        if: matrix.platform == 'linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Install Task (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          Write-Host "Task installed successfully"

      - name: Install Wails3
        shell: bash
        run: go install -v github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      # -----------------------------------------------------------------------
      # Linux Build
      # -----------------------------------------------------------------------
      - name: Build Linux App (Production)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release
          wails3 doctor

          # Update build assets
          wails3 task common:update:build-assets

          # Build the application
          wails3 task package

          # Generate deb package
          wails3 tool package -name gotohp -format deb -config ./build/linux/nfpm/nfpm.yaml -out ./release

          # Build CLI binary and package without Wails/WebView dependencies
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags cli -trimpath -buildvcs=false -ldflags="-w -s" -o "bin/gotohp-cli"
          cp bin/gotohp-cli "release/gotohp-cli_amd64"
          nfpm package --packager deb --config ./build/linux/nfpm/nfpm-cli.yaml --target ./release/gotohp-cli_amd64.deb

          # Generate AppImage
          wails3 package
          mv bin/gotohp-x86_64.AppImage "release/gotohp_amd64.AppImage"
          rm -f bin/gotohp-x86_64.AppImage

          # Rename .deb file if needed
          if [ -f "release/gotohp.deb" ]; then
            mv "release/gotohp.deb" "release/gotohp_amd64.deb"
          fi

      - name: Build Linux App (Debug)
        if: matrix.platform == 'linux' && ((github.event_name == 'workflow_dispatch' && inputs.build_debug) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')))
        run: |
          rm -f bin/gotohp
          wails3 build DEV=true
          cp bin/gotohp "release/gotohp_amd64_debug"

      # -----------------------------------------------------------------------
      # Windows Build
      # -----------------------------------------------------------------------
      - name: Build Windows App (Production)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          mkdir -p release
          wails3 doctor

          # Update build assets
          task common:update:build-assets

          # Build the GUI application with production flags
          task windows:build
          Move-Item -Path "bin\gotohp.exe" -Destination "release\gotohp-x64.exe"

          # Build standalone CLI binary without Wails/WebView dependencies
          $env:CGO_ENABLED="0"
          $env:GOOS="windows"
          $env:GOARCH="amd64"
          go build -tags cli -trimpath -buildvcs=false -ldflags="-w -s" -o "release\gotohp-cli-x64.exe"

      - name: Build Windows App (Debug)
        if: matrix.platform == 'windows' && ((github.event_name == 'workflow_dispatch' && inputs.build_debug) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')))
        shell: pwsh
        run: |
          Remove-Item -Path "bin\gotohp.exe" -ErrorAction SilentlyContinue
          Remove-Item -Path "bin\gotohp-cli.exe" -ErrorAction SilentlyContinue
          wails3 build DEV=true
          Move-Item -Path "bin\gotohp.exe" -Destination "release\gotohp-x64_debug.exe"
          $env:CGO_ENABLED="0"
          $env:GOOS="windows"
          $env:GOARCH="amd64"
          go build -tags cli -buildvcs=false -gcflags=all="-l" -o "release\gotohp-cli-x64_debug.exe"

      # -----------------------------------------------------------------------
      # macOS Build
      # -----------------------------------------------------------------------
      - name: Build macOS App (Production)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p release
          wails3 doctor

          # Update build assets
          wails3 task common:update:build-assets

          # Build the app package
          wails3 task darwin:package:universal

          # Package the universal .app into a styled DMG installer.
          wails3 task darwin:create:dmg
          mv bin/gotohp.dmg release/gotohp-macos-universal.dmg

          # Build standalone CLI binary without Wails/WebView dependencies
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -tags cli -trimpath -buildvcs=false -ldflags="-w -s" -o bin/gotohp-cli-amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags cli -trimpath -buildvcs=false -ldflags="-w -s" -o bin/gotohp-cli-arm64
          lipo -create -output release/gotohp-cli-macos-universal bin/gotohp-cli-amd64 bin/gotohp-cli-arm64
          rm bin/gotohp-cli-amd64 bin/gotohp-cli-arm64

          # Create zip file of the .app bundle
          cd bin
          zip -r ../release/gotohp-macos-universal.zip gotohp.app
          cd ..

      - name: Build macOS App (Debug)
        if: matrix.platform == 'macos' && ((github.event_name == 'workflow_dispatch' && inputs.build_debug) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')))
        run: |
          rm -rf bin/gotohp.app
          rm -f bin/gotohp
          wails3 build DEV=true
          mv bin/gotohp release/gotohp-macos-universal_debug

      # -----------------------------------------------------------------------
      # Checksums & Artifact Upload
      # -----------------------------------------------------------------------
      - name: Generate Platform Checksums
        shell: bash
        run: |
          cd release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS-${{ matrix.platform }}.txt
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 * > SHA256SUMS-${{ matrix.platform }}.txt
          fi
          cat SHA256SUMS-${{ matrix.platform }}.txt

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-installers
          path: release/*

  package-artifacts:
    name: Package All Installers & Checksums
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Platform Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-installers"
          merge-multiple: true
          path: release

      - name: Generate Unified SHA256SUMS
        run: |
          cd release
          rm -f SHA256SUMS*.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Unified Installers & Checksums
        uses: actions/upload-artifact@v7
        with:
          name: all-installers
          path: release/*

  release:
    name: Attach Release Assets
    runs-on: ubuntu-latest
    needs: package-artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Packaged Installers
        uses: actions/download-artifact@v8
        with:
          name: all-installers
          path: release

      - name: Upload Assets to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Release Please creates the release before pushing the tag; the
          # create call is a fallback for manually pushed tags.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
