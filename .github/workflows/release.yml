name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to release (e.g. v2.0.0)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  get-version:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      is_prerelease: ${{ steps.ver.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: ver
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            CARGO_VER=$(grep -m1 '^version =' crates/lumen-tauri/Cargo.toml | cut -d '"' -f2)
            TAG="v$CARGO_VER"
          fi
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]] || [[ "$TAG" == *".."* ]]; then
            echo "Error: Invalid release tag '$TAG'. Expected format ^v[0-9A-Za-z._-]+$ without '..'." >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          if [[ "$TAG" == *-* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi
          echo "Release tag: $TAG"
          echo "Detected version: $VERSION"
          echo "Is prerelease: $IS_PRERELEASE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

  test:
    name: Test Suite (Linux x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev protobuf-compiler

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend --engine-strict=false

      - name: Test, Lint & Build Frontend
        run: |
          npm test --prefix frontend
          npm run lint --prefix frontend
          npm run build --prefix frontend

      - name: Run Workspace Tests
        run: cargo test --workspace

  build-macos:
    name: Build macOS (Universal)
    needs: [get-version, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend --engine-strict=false

      - name: Test, Lint & Build Frontend
        run: |
          npm test --prefix frontend
          npm run lint --prefix frontend
          npm run build --prefix frontend

      - name: Build Tauri Universal Bundle (.app & .dmg)
        working-directory: crates/lumen-tauri
        run: npx --prefix ../../frontend tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Build Standalone Universal CLI
        run: |
          cargo build --release -p lumen-cli --bin lumen-cli --target x86_64-apple-darwin
          cargo build --release -p lumen-cli --bin lumen-cli --target aarch64-apple-darwin

      - name: Stage Release Artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          set -o pipefail
          V="$RELEASE_VERSION"
          mkdir -p dist

          # 1. Universal DMG installer (styled using dmgbuild to write .DS_Store directly on headless CI)
          python3 -m pip install --break-system-packages --require-hashes -r scripts/dmg-requirements.txt || python3 -m pip install --require-hashes -r scripts/dmg-requirements.txt
          APP_PATH="target/universal-apple-darwin/release/bundle/macos/Lumen.app"
          OUT_DMG="dist/lumen_${V}_macos_universal.dmg"

          if [ -d "$APP_PATH" ]; then
            echo "Building styled DMG with dmgbuild..."
            python3 -m dmgbuild -s scripts/dmg_settings.py -D app="$APP_PATH" -D repo_root="$PWD" "Lumen" "$OUT_DMG" || true
          fi

          # Fallback to Tauri DMG only if dmgbuild failed to generate the file
          if [ ! -f "$OUT_DMG" ]; then
            echo "Warning: dmgbuild failed, falling back to Tauri DMG..."
            DMG_FILE=$(find target/universal-apple-darwin/release/bundle -name "*.dmg" 2>/dev/null | head -n 1 || true)
            if [ -n "$DMG_FILE" ] && [ -f "$DMG_FILE" ]; then
              cp "$DMG_FILE" "$OUT_DMG"
            else
              echo "Error: Failed to produce DMG installer."
              exit 1
            fi
          fi

          # 2. Universal .app zip bundle
          if [ -d "target/universal-apple-darwin/release/bundle/macos/Lumen.app" ]; then
            (cd target/universal-apple-darwin/release/bundle/macos && zip -r "../../../../../dist/lumen_${V}_macos_universal.zip" Lumen.app)
          else
            echo "Error: Missing Lumen.app bundle."
            exit 1
          fi

          # 3. Universal CLI binary
          lipo -create -output "dist/lumen-cli_${V}_macos_universal" \
            target/x86_64-apple-darwin/release/lumen-cli \
            target/aarch64-apple-darwin/release/lumen-cli
          chmod +x "dist/lumen-cli_${V}_macos_universal"

          ls -la dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assets-macos-universal
          path: dist/*

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: [get-version, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extra_deps: ""
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extra_deps: "libfuse2t64 patchelf"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux System Dependencies
        env:
          EXTRA_DEPS: ${{ matrix.extra_deps }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev protobuf-compiler $EXTRA_DEPS

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend --engine-strict=false

      - name: Test, Lint & Build Frontend
        run: |
          npm test --prefix frontend
          npm run lint --prefix frontend
          npm run build --prefix frontend

      - name: Build Tauri Bundles (.deb & AppImage)
        working-directory: crates/lumen-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx --prefix ../../frontend tauri build --bundles appimage,deb

      - name: Build Standalone Linux CLI
        run: cargo build --release -p lumen-cli --bin lumen-cli

      - name: Stage Release Artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.get-version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -o pipefail
          V="$RELEASE_VERSION"
          mkdir -p dist

          # 1. AppImage
          APPIMAGE=$(find target/release/bundle/appimage -name "*.AppImage" 2>/dev/null | head -n 1 || true)
          if [ -n "$APPIMAGE" ] && [ -f "$APPIMAGE" ]; then
            cp "$APPIMAGE" "dist/lumen_${V}_linux_${ARCH}.AppImage"
            chmod +x "dist/lumen_${V}_linux_${ARCH}.AppImage"
          else
            echo "Error: Missing AppImage artifact."
            exit 1
          fi

          # 2. Debian / Ubuntu .deb
          DEB_FILE=$(find target/release/bundle/deb -name "*.deb" 2>/dev/null | head -n 1 || true)
          if [ -n "$DEB_FILE" ] && [ -f "$DEB_FILE" ]; then
            cp "$DEB_FILE" "dist/lumen_${V}_linux_${ARCH}.deb"
          else
            echo "Error: Missing .deb artifact."
            exit 1
          fi

          # 3. Standalone GUI binary
          if [ -f "target/release/lumen" ]; then
            cp "target/release/lumen" "dist/lumen_${V}_linux_${ARCH}"
            chmod +x "dist/lumen_${V}_linux_${ARCH}"
          else
            echo "Error: Missing standalone lumen binary."
            exit 1
          fi

          # 4. Standalone CLI binary
          if [ -f "target/release/lumen-cli" ]; then
            cp "target/release/lumen-cli" "dist/lumen-cli_${V}_linux_${ARCH}"
            chmod +x "dist/lumen-cli_${V}_linux_${ARCH}"
          else
            echo "Error: Missing standalone lumen-cli binary."
            exit 1
          fi

          ls -la dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assets-linux-${{ matrix.arch }}
          path: dist/*

  build-windows-x64:
    name: Build Windows (x64)
    needs: [get-version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        shell: pwsh
        run: npm ci --prefix frontend --engine-strict=false

      - name: Build Frontend
        shell: pwsh
        run: npm run build --prefix frontend

      - name: Build Application Binaries
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --release -p lumen-tauri --bin lumen
          cargo build --release -p lumen-cli --bin lumen-cli

      - name: Package Custom Installer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          tar -czf crates/lumen-installer/payload.tar.gz -C target/release lumen.exe lumen-cli.exe
          cargo build --release -p lumen-installer --bin lumen-installer

      - name: Stage Release Artifacts
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $V = $env:RELEASE_VERSION
          New-Item -ItemType Directory -Force -Path dist

          # 1. Custom Setup Installer
          if (Test-Path "target/release/lumen-installer.exe") {
            Copy-Item -Path "target/release/lumen-installer.exe" -Destination "dist/lumen_${V}_windows_x64-setup.exe"
          } else {
            Write-Error "Missing Windows x64 installer binary."
            exit 1
          }

          # 2. Standalone GUI executable
          if (Test-Path "target/release/lumen.exe") {
            Copy-Item -Path "target/release/lumen.exe" -Destination "dist/lumen_${V}_windows_x64.exe"
          } else {
            Write-Error "Missing Windows x64 GUI binary."
            exit 1
          }

          # 3. Standalone CLI executable
          if (Test-Path "target/release/lumen-cli.exe") {
            Copy-Item -Path "target/release/lumen-cli.exe" -Destination "dist/lumen-cli_${V}_windows_x64.exe"
          } else {
            Write-Error "Missing Windows x64 CLI binary."
            exit 1
          }

          Get-ChildItem -Path dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assets-windows-x64
          path: dist/*

  build-windows-arm64:
    name: Build Windows (ARM64)
    needs: [get-version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        shell: pwsh
        run: npm ci --prefix frontend --engine-strict=false

      - name: Build Frontend
        shell: pwsh
        run: npm run build --prefix frontend

      - name: Build Application Binaries
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --release -p lumen-tauri --bin lumen --target aarch64-pc-windows-msvc
          cargo build --release -p lumen-cli --bin lumen-cli --target aarch64-pc-windows-msvc

      - name: Package Custom Installer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          tar -czf crates/lumen-installer/payload.tar.gz -C target/aarch64-pc-windows-msvc/release lumen.exe lumen-cli.exe
          cargo build --release -p lumen-installer --bin lumen-installer --target aarch64-pc-windows-msvc

      - name: Stage Release Artifacts
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $V = $env:RELEASE_VERSION
          New-Item -ItemType Directory -Force -Path dist

          # 1. Custom Setup Installer (ARM64)
          if (Test-Path "target/aarch64-pc-windows-msvc/release/lumen-installer.exe") {
            Copy-Item -Path "target/aarch64-pc-windows-msvc/release/lumen-installer.exe" -Destination "dist/lumen_${V}_windows_arm64-setup.exe"
          } else {
            Write-Error "Missing Windows ARM64 installer binary."
            exit 1
          }

          # 2. Standalone GUI executable (ARM64)
          if (Test-Path "target/aarch64-pc-windows-msvc/release/lumen.exe") {
            Copy-Item -Path "target/aarch64-pc-windows-msvc/release/lumen.exe" -Destination "dist/lumen_${V}_windows_arm64.exe"
          } else {
            Write-Error "Missing Windows ARM64 GUI binary."
            exit 1
          }

          # 3. Standalone CLI executable (ARM64)
          if (Test-Path "target/aarch64-pc-windows-msvc/release/lumen-cli.exe") {
            Copy-Item -Path "target/aarch64-pc-windows-msvc/release/lumen-cli.exe" -Destination "dist/lumen-cli_${V}_windows_arm64.exe"
          } else {
            Write-Error "Missing Windows ARM64 CLI binary."
            exit 1
          }

          Get-ChildItem -Path dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assets-windows-arm64
          path: dist/*

  publish:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs: [get-version, build-macos, build-linux, build-windows-x64, build-windows-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Release Notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/release-notes

      - name: Download All Release Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare Release Notes
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.get-version.outputs.tag }}
        run: |
          HAS_CUSTOM="false"
          if [[ "$RELEASE_TAG" =~ ^v[0-9A-Za-z._-]+$ ]] && [[ "$RELEASE_TAG" != *".."* ]]; then
            NOTES_FILE=".github/release-notes/${RELEASE_TAG}.md"
            if [ -f "$NOTES_FILE" ]; then
              cp "$NOTES_FILE" release_body.md
              HAS_CUSTOM="true"
            else
              : > release_body.md
            fi
          else
            : > release_body.md
          fi
          printf '\n> **Release Builds**: Please download official builds directly from [GitHub Releases](https://github.com/Reiux/Lumen/releases).\n' >> release_body.md
          echo "has_custom=$HAS_CUSTOM" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ needs.get-version.outputs.tag }}"
          name: "Lumen ${{ needs.get-version.outputs.tag }}"
          files: release-assets/*
          body_path: release_body.md
          append_body: ${{ steps.notes.outputs.has_custom != 'true' }}
          generate_release_notes: ${{ steps.notes.outputs.has_custom != 'true' }}
          draft: false
          prerelease: ${{ needs.get-version.outputs.is_prerelease == 'true' }}
