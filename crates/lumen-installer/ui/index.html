<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen Setup</title>
  <style>
    :root {
      --m3-surface: #121316;
      --m3-surface-container: #1b1c20;
      --m3-surface-container-high: #26272c;
      --m3-surface-container-highest: #32333a;
      --m3-primary: #a8c7fa;
      --m3-on-primary: #042f6e;
      --m3-primary-container: #0842a0;
      --m3-on-primary-container: #d3e3fd;
      --m3-secondary-container: #2e3542;
      --m3-on-secondary-container: #d7e3f8;
      --m3-error: #f2b8b5;
      --m3-on-error: #601410;
      --m3-on-surface: #e3e2e6;
      --m3-on-surface-variant: #c4c6d0;
      --m3-outline-variant: rgba(255, 255, 255, 0.10);
      --m3-radius-sm: 8px;
      --m3-radius-md: 16px;
      --m3-radius-lg: 24px;
      --m3-radius-full: 9999px;
      --m3-font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--m3-surface);
      color: var(--m3-on-surface);
      font-family: var(--m3-font);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--m3-outline-variant);
      border-radius: var(--m3-radius-lg);
      position: relative;
    }

    /* Background Layer with Transparent Pinwheel Artwork */
    .bg-artwork {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .pinwheel-svg-bg {
      position: absolute;
      left: -20px;
      top: 50%;
      transform: translateY(-50%);
      width: 320px;
      height: 320px;
      opacity: 0.28;
      filter: drop-shadow(0 0 35px rgba(56, 189, 248, 0.35));
    }

    .bg-white-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 140px 50%, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 65%, transparent 100%),
                  linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.25) 100%);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* Window Titlebar */
    .titlebar {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 20;
      cursor: default;
    }

    .titlebar-drag {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      height: 100%;
    }

    .titlebar-icon {
      width: 16px;
      height: 16px;
      fill: var(--m3-primary);
    }

    .titlebar-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--m3-on-surface-variant);
      letter-spacing: 0.2px;
    }

    .titlebar-controls {
      display: flex;
      gap: 4px;
    }

    .win-btn {
      width: 28px;
      height: 28px;
      border-radius: var(--m3-radius-sm);
      border: none;
      background: transparent;
      color: var(--m3-on-surface-variant);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .win-btn:hover {
      background: var(--m3-surface-container-high);
      color: var(--m3-on-surface);
    }

    .win-btn.close:hover {
      background: #e81123;
      color: #ffffff;
    }

    /* Main Viewport Container */
    .view-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 10;
      padding: 8px 32px 24px 32px;
      overflow: hidden;
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      animation: fadeIn 0.3s cubic-bezier(0.2, 0, 0, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hero Text positioned starting from the logo center dot going right */
    .hero-area {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
    }

    .hero-text-align {
      margin-left: 170px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-title {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.8px;
      line-height: 1.05;
      color: #ffffff;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .version-tag {
      font-size: 13px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: var(--m3-radius-full);
      background: rgba(168, 199, 250, 0.15);
      color: var(--m3-primary);
      border: 1px solid rgba(168, 199, 250, 0.25);
      vertical-align: middle;
      letter-spacing: 0;
    }

    .hero-subtitle {
      font-size: 15px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 8px;
      line-height: 1.4;
      max-width: 380px;
    }

    /* Custom Drawer Card */
    .custom-drawer {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      background: var(--m3-surface-container);
      border: 1px solid var(--m3-outline-variant);
      border-radius: var(--m3-radius-md);
      padding: 0 16px;
      margin-bottom: 12px;
      transition: max-height 0.3s cubic-bezier(0.2, 0, 0, 1),
                  opacity 0.25s cubic-bezier(0.2, 0, 0, 1),
                  padding 0.3s cubic-bezier(0.2, 0, 0, 1);
    }

    .custom-drawer.expanded {
      max-height: 150px;
      opacity: 1;
      padding: 14px 16px;
    }

    .drawer-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--m3-on-surface-variant);
      margin-bottom: 6px;
      display: block;
    }

    .drawer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .drawer-input {
      flex: 1;
      background: var(--m3-surface-container-high);
      border: 1px solid var(--m3-outline-variant);
      border-radius: var(--m3-radius-sm);
      height: 34px;
      padding: 0 10px;
      font-size: 12px;
      color: var(--m3-on-surface);
      outline: none;
      font-family: inherit;
    }

    .drawer-input:focus {
      border-color: var(--m3-primary);
    }

    .btn-browse {
      background: var(--m3-surface-container-highest);
      color: var(--m3-on-surface);
      border: 1px solid var(--m3-outline-variant);
      border-radius: var(--m3-radius-sm);
      height: 34px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }

    .btn-browse:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .drawer-checkboxes {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--m3-on-surface);
      cursor: pointer;
    }

    .checkbox-label input {
      accent-color: var(--m3-primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* Bottom Actions Row - Side-by-Side on the Right */
    .bottom-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      padding-top: 10px;
    }

    .btn-m3-primary {
      background: var(--m3-primary);
      color: var(--m3-on-primary);
      border: none;
      border-radius: var(--m3-radius-full);
      height: 44px;
      padding: 0 32px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(168, 199, 250, 0.25);
      transition: background 0.2s cubic-bezier(0.2, 0, 0, 1),
                  transform 0.15s cubic-bezier(0.2, 0, 0, 1),
                  border-radius 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .btn-m3-primary:hover {
      background: #c3d9fb;
      box-shadow: 0 6px 18px rgba(168, 199, 250, 0.35);
      border-radius: 18px;
    }

    .btn-m3-primary:active {
      transform: scale(0.97);
      border-radius: 14px;
    }

    .btn-m3-tonal {
      background: var(--m3-surface-container-high);
      color: var(--m3-on-surface);
      border: 1px solid var(--m3-outline-variant);
      border-radius: var(--m3-radius-full);
      height: 44px;
      padding: 0 24px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .btn-m3-tonal:hover {
      background: var(--m3-surface-container-highest);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-m3-tonal:active {
      transform: scale(0.97);
    }

    .btn-m3-danger {
      background: var(--m3-error);
      color: var(--m3-on-error);
      border: none;
      border-radius: var(--m3-radius-full);
      height: 44px;
      padding: 0 32px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-m3-danger:hover {
      background: #f7d2d0;
    }

    /* Screen 2: Installing View */
    .screen-installing {
      flex: 1;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 22px;
      animation: fadeIn 0.3s cubic-bezier(0.2, 0, 0, 1) forwards;
    }

    .installing-title {
      font-size: 26px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .installing-subtitle {
      font-size: 13px;
      color: var(--m3-on-surface-variant);
      margin-top: 4px;
      min-height: 18px;
    }

    /* Material 3 Expressive Wavy Progress Indicator */
    .m3-wavy-progress-wrapper {
      width: 380px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
    }

    .m3-wavy-svg-box {
      width: 100%;
      height: 16px;
      position: relative;
      background: transparent;
      border: none;
      border-radius: 0;
    }

    .wavy-track {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      transform: translateY(-50%);
    }

    .wavy-track-stop {
      position: absolute;
      right: 0;
      top: 50%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.28);
      transform: translateY(-50%);
    }

    .wavy-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 16px;
      overflow: visible;
    }

    .wavy-indicator {
      fill: none;
      stroke: var(--m3-primary);
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(168, 199, 250, 0.5));
      transition: stroke-dashoffset 0.4s cubic-bezier(0.2, 0, 0, 1);
    }

    .progress-percent-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--m3-primary);
      letter-spacing: 0.5px;
    }

    /* Installation Error Box */
    .install-error-box {
      width: 440px;
      background: rgba(242, 184, 181, 0.1);
      border: 1px solid rgba(242, 184, 181, 0.3);
      border-radius: var(--m3-radius-md);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    .install-error-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--m3-error);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .install-error-text {
      font-size: 13px;
      color: var(--m3-on-surface);
      line-height: 1.4;
      word-break: break-word;
    }

    .install-error-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* Screen 3: Installation Complete Screen */
    .screen-complete {
      flex: 1;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      animation: fadeIn 0.3s cubic-bezier(0.2, 0, 0, 1) forwards;
    }

    .complete-hero-align {
      margin-left: 170px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .complete-title {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.6px;
      line-height: 1.1;
      color: #ffffff;
    }

    .complete-subtitle {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 8px;
      line-height: 1.4;
      max-width: 380px;
    }
  </style>
</head>
<body>
  <!-- Ambient Layer with Pure Transparent SVG Pinwheel -->
  <div class="bg-artwork" data-tauri-drag-region>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" class="pinwheel-svg-bg" id="pinwheelBg">
      <g>
        <!-- Blade 1: Top-Right (0 deg) -->
        <g transform="rotate(0 54 54)">
          <path fill="#38BDF8" d="M 54,26 C 65,26 76,36 76,47 C 76,52 70,54 63,54 C 59,44 54,35 54,26 Z"/>
        </g>
        <!-- Blade 2: Bottom-Right (90 deg) -->
        <g transform="rotate(90 54 54)">
          <path fill="#60A5FA" d="M 54,26 C 65,26 76,36 76,47 C 76,52 70,54 63,54 C 59,44 54,35 54,26 Z"/>
        </g>
        <!-- Blade 3: Bottom-Left (180 deg) -->
        <g transform="rotate(180 54 54)">
          <path fill="#818CF8" d="M 54,26 C 65,26 76,36 76,47 C 76,52 70,54 63,54 C 59,44 54,35 54,26 Z"/>
        </g>
        <!-- Blade 4: Top-Left (270 deg) -->
        <g transform="rotate(270 54 54)">
          <path fill="#A78BFA" d="M 54,26 C 65,26 76,36 76,47 C 76,52 70,54 63,54 C 59,44 54,35 54,26 Z"/>
        </g>
        <!-- Radiant Center Core Circle -->
        <circle cx="54" cy="54" r="7" fill="#FFFFFF"/>
      </g>
    </svg>
    <div class="bg-white-overlay" data-tauri-drag-region></div>
  </div>

  <!-- Frameless Titlebar -->
  <div class="titlebar" data-tauri-drag-region>
    <div class="titlebar-drag" data-tauri-drag-region>
      <svg class="titlebar-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5 10 5 10-5-5-2.5-5 2.5z"/></svg>
      <span class="titlebar-text" id="windowTitle">Lumen Setup</span>
    </div>
    <div class="titlebar-controls">
      <button class="win-btn" id="btnMinimize" title="Minimize">
        <svg width="10" height="1" viewBox="0 0 10 1"><path fill="currentColor" d="M0 0h10v1H0z"/></svg>
      </button>
      <button class="win-btn close" id="btnClose" title="Close">
        <svg width="10" height="10" viewBox="0 0 10 10"><path fill="currentColor" d="M1 0L0 1l4 4-4 4 1 1 4-4 4 4 1-1-4-4 4-4-1-1-4 4-4-4z"/></svg>
      </button>
    </div>
  </div>

  <!-- Main View Area -->
  <div class="view-container">

    <!-- Screen 1: Welcome & Setup Screen -->
    <div class="screen" id="screenWelcome">
      <div class="hero-area" data-tauri-drag-region>
        <div class="hero-text-align">
          <div class="hero-title" id="heroTitle">
            Lumen <span class="version-tag">v1.1.0</span>
          </div>
          <div class="hero-subtitle" id="heroSubtitle">
            Unofficial desktop client for Google Photos
          </div>
        </div>
      </div>

      <!-- Custom Options Drawer -->
      <div class="custom-drawer" id="customDrawer">
        <span class="drawer-label">Install Location</span>
        <div class="drawer-row">
          <input type="text" class="drawer-input" id="installPathInput" readonly>
          <button class="btn-browse" id="btnBrowse">Browse...</button>
        </div>
        <div class="drawer-checkboxes">
          <label class="checkbox-label">
            <input type="checkbox" id="chkDesktopShortcut" checked>
            <span>Create desktop shortcut</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="chkLaunchAfter" checked>
            <span>Launch Lumen when finished</span>
          </label>
        </div>
      </div>

      <!-- Uninstall Purge Checkbox -->
      <div id="uninstallOptions" style="display: none; margin-bottom: 12px;">
        <label class="checkbox-label">
          <input type="checkbox" id="chkPurgeConfig">
          <span>Also delete account configuration and cache (<code id="configPathLabel" style="font-family: monospace; color: var(--m3-primary);">%APPDATA%\lumen</code>)</span>
        </label>
      </div>

      <!-- Bottom Actions: Fresh Setup -->
      <div class="bottom-actions" id="normalActions">
        <button class="btn-m3-tonal" id="btnToggleCustom">Customize</button>
        <button class="btn-m3-primary" id="btnMainInstall">Install</button>
      </div>

      <!-- Bottom Actions: Already Installed State -->
      <div class="bottom-actions" id="installedActions" style="display: none;">
        <button class="btn-m3-danger" id="btnGoUninstall" style="margin-right: auto;">Uninstall</button>
        <button class="btn-m3-tonal" id="btnRepair">Repair</button>
        <button class="btn-m3-tonal" id="btnToggleCustomInstalled">Customize</button>
        <button class="btn-m3-primary" id="btnLaunchExisting">Launch Lumen</button>
      </div>
    </div>

    <!-- Screen 2: Installing with Material 3 Expressive Wavy Progress -->
    <div class="screen-installing" id="screenInstalling">
      <div class="installing-title" id="installingTitle">Installing Lumen...</div>
      <div class="installing-subtitle" id="installingSubtitle">Extracting application binaries...</div>

      <div class="m3-wavy-progress-wrapper" id="progressWrapper">
        <div class="m3-wavy-svg-box">
          <div class="wavy-track"></div>
          <div class="wavy-track-stop"></div>
          <svg class="wavy-svg" viewBox="0 0 380 16">
            <path id="wavyIndicator" class="wavy-indicator" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" d="M 0 8 C 5.5 4.5, 13.5 4.5, 19.0 8 C 24.5 11.5, 32.5 11.5, 38.0 8 C 43.5 4.5, 51.5 4.5, 57.0 8 C 62.5 11.5, 70.5 11.5, 76.0 8 C 81.5 4.5, 89.5 4.5, 95.0 8 C 100.5 11.5, 108.5 11.5, 114.0 8 C 119.5 4.5, 127.5 4.5, 133.0 8 C 138.5 11.5, 146.5 11.5, 152.0 8 C 157.5 4.5, 165.5 4.5, 171.0 8 C 176.5 11.5, 184.5 11.5, 190.0 8 C 195.5 4.5, 203.5 4.5, 209.0 8 C 214.5 11.5, 222.5 11.5, 228.0 8 C 233.5 4.5, 241.5 4.5, 247.0 8 C 252.5 11.5, 260.5 11.5, 266.0 8 C 271.5 4.5, 279.5 4.5, 285.0 8 C 290.5 11.5, 298.5 11.5, 304.0 8 C 309.5 4.5, 317.5 4.5, 323.0 8 C 328.5 11.5, 336.5 11.5, 342.0 8 C 347.5 4.5, 355.5 4.5, 361.0 8 C 366.5 11.5, 374.5 11.5, 380.0 8" />
          </svg>
        </div>
        <div class="progress-percent-label" id="progressPercentLabel">0%</div>
      </div>

      <!-- Installation Error Box -->
      <div class="install-error-box" id="installErrorBox" style="display: none;">
        <div class="install-error-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          Installation Problem
        </div>
        <div class="install-error-text" id="installErrorText"></div>
        <div class="install-error-actions">
          <button class="btn-m3-tonal" id="btnCancelInstall">Close</button>
          <button class="btn-m3-primary" id="btnRetryInstall">Retry</button>
        </div>
      </div>
    </div>

    <!-- Screen 3: Installation Complete Screen -->
    <div class="screen-complete" id="screenComplete">
      <div class="hero-area" data-tauri-drag-region>
        <div class="complete-hero-align">
          <div class="complete-title" id="completeTitle">Installation Complete</div>
          <div class="complete-subtitle" id="completeSubtitle">
            Lumen has been installed to your computer and is ready for use.
          </div>
        </div>
      </div>

      <!-- Bottom Right: Checkbox + Finish Button -->
      <div class="bottom-actions">
        <label class="checkbox-label" id="finishLaunchWrapper">
          <input type="checkbox" id="chkFinishLaunch" checked>
          <span>Launch Lumen</span>
        </label>
        <button class="btn-m3-primary" id="btnFinishAction">Finish</button>
      </div>
    </div>

  </div>

  <script>
    const invoke = window.__TAURI__ ? window.__TAURI__.core.invoke : async () => {};

    let isUninstallMode = false;
    let installedTargetDir = "";

    // Window controls
    document.getElementById('btnMinimize').addEventListener('click', () => invoke('minimize_installer'));
    document.getElementById('btnClose').addEventListener('click', () => invoke('close_installer'));

    // Enable smooth native window dragging on non-interactive areas
    document.addEventListener('mousedown', (e) => {
      if (e.buttons === 1) {
        if (!e.target.closest('button, input, label, a, .custom-drawer, .bottom-actions')) {
          invoke('start_dragging');
        }
      }
    });

    // Drawer toggle
    const btnToggleCustom = document.getElementById('btnToggleCustom');
    const btnToggleCustomInstalled = document.getElementById('btnToggleCustomInstalled');
    const customDrawer = document.getElementById('customDrawer');

    function toggleCustomDrawer(btn) {
      const isOpen = customDrawer.classList.toggle('expanded');
      btn.textContent = isOpen ? "Hide Options" : "Customize";
    }

    btnToggleCustom.addEventListener('click', () => toggleCustomDrawer(btnToggleCustom));
    btnToggleCustomInstalled.addEventListener('click', () => toggleCustomDrawer(btnToggleCustomInstalled));

    // Sync chkLaunchAfter with chkFinishLaunch
    document.getElementById('chkLaunchAfter').addEventListener('change', (e) => {
      document.getElementById('chkFinishLaunch').checked = e.target.checked;
    });

    // Browse Directory
    document.getElementById('btnBrowse').addEventListener('click', async () => {
      try {
        const selected = await invoke('pick_directory');
        if (selected) {
          document.getElementById('installPathInput').value = selected;
        }
      } catch (err) {
        console.error("Failed to pick directory:", err);
      }
    });

    // Initialize
    async function init() {
      try {
        const info = await invoke('get_setup_info');
        isUninstallMode = info.is_uninstall;
        installedTargetDir = info.default_path;

        if (info.config_path) {
          const configLabel = document.getElementById('configPathLabel');
          if (configLabel) configLabel.textContent = info.config_path;
        }

        if (isUninstallMode) {
          switchToUninstallUI();
        } else if (info.is_installed) {
          document.getElementById('installPathInput').value = info.default_path;
          document.getElementById('heroTitle').innerHTML = 'Lumen <span class="version-tag">Installed</span>';
          document.getElementById('heroSubtitle').textContent = "Lumen is installed on your computer. Choose an action below.";
          document.getElementById('normalActions').style.display = 'none';
          document.getElementById('installedActions').style.display = 'flex';
        } else {
          document.getElementById('installPathInput').value = info.default_path;
          document.getElementById('normalActions').style.display = 'flex';
          document.getElementById('installedActions').style.display = 'none';
        }
      } catch (err) {
        console.error("Init error:", err);
      } finally {
        await invoke('show_window');
      }
    }

    function switchToUninstallUI() {
      isUninstallMode = true;
      document.getElementById('windowTitle').textContent = "Lumen Uninstaller";
      document.getElementById('heroTitle').innerHTML = "Uninstall Lumen?";
      document.getElementById('heroSubtitle').textContent = "Remove Lumen and shortcuts from your computer";
      document.getElementById('normalActions').style.display = 'flex';
      document.getElementById('installedActions').style.display = 'none';
      document.getElementById('btnToggleCustom').style.display = 'none';
      customDrawer.classList.remove('expanded');
      customDrawer.style.display = 'none';
      document.getElementById('uninstallOptions').style.display = 'block';

      const btn = document.getElementById('btnMainInstall');
      btn.textContent = "Uninstall";
      btn.className = "btn-m3-danger";
    }

    // Installed Actions handlers
    document.getElementById('btnLaunchExisting').addEventListener('click', async () => {
      await invoke('launch_app', { targetDir: installedTargetDir });
      await invoke('close_installer');
    });

    document.getElementById('btnRepair').addEventListener('click', async () => {
      document.getElementById('screenWelcome').style.display = 'none';
      document.getElementById('screenInstalling').style.display = 'flex';
      document.getElementById('installingTitle').textContent = "Repairing Lumen...";
      const desktopShortcut = document.getElementById('chkDesktopShortcut').checked;
      await performInstall(installedTargetDir, desktopShortcut);
    });

    document.getElementById('btnGoUninstall').addEventListener('click', () => {
      switchToUninstallUI();
    });

    // Error Box handlers
    function showInstallError(err) {
      document.getElementById('progressWrapper').style.display = 'none';
      document.getElementById('installingTitle').textContent = "Installation Problem";
      document.getElementById('installingSubtitle').textContent = "Unable to finish copying or registering files.";
      document.getElementById('installErrorText').textContent = String(err);
      document.getElementById('installErrorBox').style.display = 'flex';
    }

    document.getElementById('btnRetryInstall').addEventListener('click', async () => {
      document.getElementById('installErrorBox').style.display = 'none';
      document.getElementById('progressWrapper').style.display = 'flex';
      const targetDir = document.getElementById('installPathInput').value;
      const desktopShortcut = document.getElementById('chkDesktopShortcut').checked;
      await performInstall(targetDir, desktopShortcut);
    });

    document.getElementById('btnCancelInstall').addEventListener('click', () => {
      invoke('close_installer');
    });

    // Main action button click
    document.getElementById('btnMainInstall').addEventListener('click', async () => {
      // Transition to Screen 2 (Installing)
      document.getElementById('screenWelcome').style.display = 'none';
      document.getElementById('screenInstalling').style.display = 'flex';

      if (isUninstallMode) {
        document.getElementById('installingTitle').textContent = "Uninstalling Lumen...";
        document.getElementById('installingSubtitle').textContent = "Removing application files and shortcuts...";
        const purge = document.getElementById('chkPurgeConfig').checked;
        await performUninstall(purge);
      } else {
        const targetDir = document.getElementById('installPathInput').value;
        installedTargetDir = targetDir;
        const desktopShortcut = document.getElementById('chkDesktopShortcut').checked;
        await performInstall(targetDir, desktopShortcut);
      }
    });

    // Update the Wavy Progress Bar
    function setProgress(pct, statusText) {
      if (statusText) {
        document.getElementById('installingSubtitle').textContent = statusText;
      }
      const indicator = document.getElementById('wavyIndicator');
      if (indicator) {
        const clamped = Math.max(0, Math.min(100, pct));
        indicator.style.strokeDashoffset = (100 - clamped);
      }
      document.getElementById('progressPercentLabel').textContent = pct + "%";
    }

    async function performInstall(targetDir, createShortcut) {
      setProgress(25, "Extracting application binaries...");
      try {
        await invoke('start_install', {
          targetDir,
          createDesktopShortcut: createShortcut,
          launchAfter: false // handled by Finish button
        });

        setProgress(75, "Creating shortcuts & registering app...");

        setTimeout(() => {
          setProgress(100, "Finishing setup...");
          setTimeout(() => {
            // Transition to Screen 3 (Complete)
            document.getElementById('screenInstalling').style.display = 'none';
            document.getElementById('screenComplete').style.display = 'flex';

            const finishBtn = document.getElementById('btnFinishAction');
            finishBtn.onclick = async () => {
              const shouldLaunch = document.getElementById('chkFinishLaunch').checked;
              if (shouldLaunch) {
                await invoke('launch_app', { targetDir: installedTargetDir });
              }
              await invoke('close_installer');
            };
          }, 600);
        }, 600);

      } catch (err) {
        showInstallError(err);
      }
    }

    async function performUninstall(purgeConfig) {
      setProgress(35, "Removing application shortcuts...");
      try {
        await invoke('start_uninstall', { purgeConfig });
        setProgress(75, "Cleaning up registry and program files...");

        setTimeout(() => {
          setProgress(100, "Removal complete");
          setTimeout(() => {
            document.getElementById('screenInstalling').style.display = 'none';
            document.getElementById('screenComplete').style.display = 'flex';

            document.getElementById('completeTitle').textContent = "Uninstalled Successfully";
            document.getElementById('completeSubtitle').textContent = "Lumen has been completely removed from your PC.";
            document.getElementById('finishLaunchWrapper').style.display = 'none';

            const finishBtn = document.getElementById('btnFinishAction');
            finishBtn.textContent = "Close";
            finishBtn.onclick = () => invoke('close_installer');
          }, 600);
        }, 600);

      } catch (err) {
        alert("Uninstall failed: " + err);
        invoke('close_installer');
      }
    }

    init();
  </script>
</body>
</html>
