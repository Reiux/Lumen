<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen Setup</title>
  <style>
    :root {
      --m3-surface: #121316;
      --m3-surface-container: #1b1c20;
      --m3-surface-container-high: #26272c;
      --m3-surface-container-highest: #32333a;
      --m3-primary: #a8c7fa;
      --m3-on-primary: #042f6e;
      --m3-primary-container: #0842a0;
      --m3-on-primary-container: #d3e3fd;
      --m3-secondary-container: #2e3542;
      --m3-on-secondary-container: #d7e3f8;
      --m3-error: #f2b8b5;
      --m3-on-error: #601410;
      --m3-on-surface: #e3e2e6;
      --m3-on-surface-variant: #c4c6d0;
      --m3-outline-variant: rgba(255, 255, 255, 0.10);
      --m3-radius-sm: 8px;
      --m3-radius-md: 16px;
      --m3-radius-lg: 24px;
      --m3-radius-full: 9999px;
      --m3-font: 'Segoe UI', system-ui, -apple-system, sans-serif;

      /* M3 Expressive Motion Springs */
      --m3-spring-fast-spatial: cubic-bezier(0.42, 1.67, 0.21, 0.90);
      --m3-spring-default-spatial: cubic-bezier(0.38, 1.21, 0.22, 1.00);
      --m3-spring-slow-spatial: cubic-bezier(0.39, 1.29, 0.35, 0.98);
      --m3-spring-fast-effects: cubic-bezier(0.31, 0.94, 0.34, 1.00);
      --m3-spring-default-effects: cubic-bezier(0.34, 0.80, 0.34, 1.00);
      --m3-spring-slow-effects: cubic-bezier(0.34, 0.88, 0.34, 1.00);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html {
      background: transparent;
      overflow: hidden;
    }

    body {
      background-color: var(--m3-surface);
      color: var(--m3-on-surface);
      font-family: var(--m3-font);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--m3-outline-variant);
      border-radius: var(--m3-radius-lg);
      position: relative;
    }

    /* Background Layer with Transparent Pinwheel Artwork */
    .bg-artwork {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .pinwheel-svg-bg {
      position: absolute;
      left: -20px;
      top: 50%;
      transform: translateY(-50%);
      width: 320px;
      height: 320px;
      opacity: 0.28;
      filter: drop-shadow(0 0 35px rgba(56, 189, 248, 0.35));
    }

    .bg-white-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 140px 50%, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 65%, transparent 100%),
                  linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.25) 100%);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* Window Titlebar */
    .titlebar {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 20;
      cursor: default;
    }

    .titlebar-drag {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      height: 100%;
    }

    .titlebar-icon {
      width: 16px;
      height: 16px;
      fill: var(--m3-primary);
    }

    .titlebar-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--m3-on-surface-variant);
      letter-spacing: 0.2px;
    }

    .titlebar-controls {
      display: flex;
      gap: 4px;
    }

    .win-btn {
      width: 28px;
      height: 28px;
      border-radius: var(--m3-radius-sm);
      border: none;
      background: transparent;
      color: var(--m3-on-surface-variant);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .win-btn:hover {
      background: var(--m3-surface-container-high);
      color: var(--m3-on-surface);
    }

    .win-btn.close:hover {
      background: #e81123;
      color: #ffffff;
    }

    /* Main Viewport Container */
    .view-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 10;
      padding: 8px 32px 24px 32px;
      overflow: hidden;
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      animation: fadeIn 0.3s cubic-bezier(0.2, 0, 0, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hero Text positioned starting from the logo center dot going right */
    .hero-area {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
    }

    .hero-text-align {
      margin-left: 170px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-title {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.8px;
      line-height: 1.05;
      color: #ffffff;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .version-tag {
      font-size: 13px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: var(--m3-radius-full);
      background: rgba(168, 199, 250, 0.15);
      color: var(--m3-primary);
      border: 1px solid rgba(168, 199, 250, 0.25);
      vertical-align: middle;
      letter-spacing: 0;
    }

    .hero-subtitle {
      font-size: 15px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 8px;
      line-height: 1.4;
      max-width: 380px;
    }

    /* Custom Drawer Card */
    .custom-drawer {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      transform: translateY(-8px) scale(0.98);
      background: var(--m3-surface-container);
      border: 1px solid transparent;
      border-radius: var(--m3-radius-md);
      padding: 0 16px;
      margin-bottom: 0;
      transition:
        max-height 0.42s var(--m3-spring-default-spatial),
        transform 0.42s var(--m3-spring-default-spatial),
        opacity 0.22s var(--m3-spring-default-effects),
        padding 0.42s var(--m3-spring-default-spatial),
        margin-bottom 0.42s var(--m3-spring-default-spatial),
        border-color 0.22s var(--m3-spring-default-effects);
    }

    .custom-drawer.expanded {
      max-height: 220px;
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      border-color: var(--m3-outline-variant);
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .custom-drawer.expanded .drawer-label,
    .custom-drawer.expanded .drawer-row,
    .custom-drawer.expanded .drawer-checkboxes {
      animation: m3DrawerItemIn 0.35s var(--m3-spring-default-spatial) both;
    }

    .custom-drawer.expanded .drawer-row {
      animation-delay: 35ms;
    }

    .custom-drawer.expanded .drawer-checkboxes {
      animation-delay: 70ms;
    }

    @keyframes m3DrawerItemIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .drawer-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--m3-on-surface-variant);
      margin-bottom: 6px;
      display: block;
    }

    .drawer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .drawer-input {
      flex: 1;
      background: var(--m3-surface-container-high);
      border: 1px solid var(--m3-outline-variant);
      border-radius: var(--m3-radius-sm);
      height: 34px;
      padding: 0 10px;
      font-size: 12px;
      color: var(--m3-on-surface);
      outline: none;
      font-family: inherit;
    }

    .drawer-input:focus {
      border-color: var(--m3-primary);
    }

    .btn-browse {
      background: var(--m3-surface-container-highest);
      color: var(--m3-on-surface);
      border: 1px solid var(--m3-outline-variant);
      border-radius: var(--m3-radius-sm);
      height: 34px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      font-family: inherit;
      transition: background 0.15s, transform 0.2s var(--m3-spring-fast-spatial);
    }

    .btn-browse:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-browse:active {
      transform: scale(0.95);
    }

    .drawer-checkboxes {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 18px;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--m3-on-surface);
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .checkbox-label input {
      accent-color: var(--m3-primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
      transition: transform 0.2s var(--m3-spring-fast-spatial);
    }

    .checkbox-label:active input {
      transform: scale(0.85);
    }

    /* Bottom Actions Row - Side-by-Side on the Right */
    .bottom-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      padding-top: 10px;
    }

    .btn-m3-primary {
      background: var(--m3-primary);
      color: var(--m3-on-primary);
      border: none;
      border-radius: var(--m3-radius-full);
      height: 44px;
      padding: 0 32px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(168, 199, 250, 0.25);
      transition:
        background 0.2s var(--m3-spring-fast-effects),
        box-shadow 0.2s var(--m3-spring-fast-effects),
        transform 0.25s var(--m3-spring-fast-spatial);
    }

    .btn-m3-primary:hover {
      background: #c3d9fb;
      box-shadow: 0 6px 18px rgba(168, 199, 250, 0.35);
      transform: translateY(-1px);
    }

    .btn-m3-primary:active {
      transform: scale(0.96) translateY(0);
      box-shadow: 0 2px 6px rgba(168, 199, 250, 0.2);
    }

    .btn-m3-tonal {
      background: var(--m3-surface-container-high);
      color: var(--m3-on-surface);
      border: 1px solid var(--m3-outline-variant);
      border-radius: var(--m3-radius-full);
      height: 44px;
      padding: 0 24px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition:
        background 0.2s var(--m3-spring-fast-effects),
        border-color 0.2s var(--m3-spring-fast-effects),
        transform 0.25s var(--m3-spring-fast-spatial);
    }

    .btn-m3-tonal:hover {
      background: var(--m3-surface-container-highest);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .btn-m3-tonal:active {
      transform: scale(0.96) translateY(0);
    }

    .btn-m3-danger {
      background: var(--m3-error);
      color: var(--m3-on-error);
      border: none;
      border-radius: var(--m3-radius-full);
      height: 44px;
      padding: 0 32px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(242, 184, 181, 0.2);
      transition:
        background 0.2s var(--m3-spring-fast-effects),
        box-shadow 0.2s var(--m3-spring-fast-effects),
        transform 0.25s var(--m3-spring-fast-spatial);
    }

    .btn-m3-danger:hover {
      background: #f7d2d0;
      box-shadow: 0 6px 18px rgba(242, 184, 181, 0.3);
      transform: translateY(-1px);
    }

    .btn-m3-danger:active {
      transform: scale(0.96) translateY(0);
    }

    .m3-ripple {
      position: absolute;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.25;
      transform: scale(0);
      pointer-events: none;
      animation: m3Ripple 0.5s cubic-bezier(0.34, 0.8, 0.34, 1) forwards;
    }

    @keyframes m3Ripple {
      to {
        transform: scale(2.6);
        opacity: 0;
      }
    }

    /* Screen Transitions and Motion Classes */
    .m3-screen-exit {
      opacity: 0 !important;
      transform: scale(0.95) translateY(-8px) !important;
      transition: opacity 0.16s var(--m3-spring-fast-effects),
                  transform 0.16s var(--m3-spring-default-spatial) !important;
      pointer-events: none;
    }

    .m3-screen-enter {
      animation: m3ScreenEnter 0.5s var(--m3-spring-slow-spatial) forwards;
    }

    @keyframes m3ScreenEnter {
      0% {
        opacity: 0;
        transform: scale(0.92) translateY(14px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .m3-shared-axis-enter {
      animation: m3SharedAxisEnter 0.4s var(--m3-spring-default-spatial) forwards;
    }

    @keyframes m3SharedAxisEnter {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Screen 2: Installing View */
    .screen-installing {
      flex: 1;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 22px;
      animation: fadeIn 0.3s cubic-bezier(0.2, 0, 0, 1) forwards;
    }

    .installing-title {
      font-size: 26px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .installing-subtitle {
      font-size: 13px;
      color: var(--m3-on-surface-variant);
      margin-top: 4px;
      min-height: 18px;
    }

    /* Material 3 Expressive Wavy Progress Indicator */
    .m3-wavy-progress-wrapper {
      width: 380px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
    }

    .m3-wavy-svg-box {
      width: 100%;
      height: 16px;
      position: relative;
      background: transparent;
      border: none;
      border-radius: 0;
      overflow: hidden;
    }

    .wavy-track {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      transform: translateY(-50%);
    }

    .wavy-track-stop {
      position: absolute;
      right: 0;
      top: 50%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.28);
      transform: translateY(-50%);
    }

    .wavy-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      overflow: hidden;
      border-radius: 4px;
      transition: width 0.4s cubic-bezier(0.2, 0, 0, 1);
    }

    .wavy-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 456px;
      height: 16px;
      overflow: visible;
      animation: waveFlow 1.2s linear infinite;
    }

    @keyframes waveFlow {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-38px);
      }
    }

    .wavy-indicator {
      fill: none;
      stroke: var(--m3-primary);
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(168, 199, 250, 0.5));
    }

    .progress-percent-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--m3-primary);
      letter-spacing: 0.5px;
    }

    /* Installation Error Box */
    .install-error-box {
      width: 440px;
      background: rgba(242, 184, 181, 0.1);
      border: 1px solid rgba(242, 184, 181, 0.3);
      border-radius: var(--m3-radius-md);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    .install-error-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--m3-error);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .install-error-text {
      font-size: 13px;
      color: var(--m3-on-surface);
      line-height: 1.4;
      word-break: break-word;
    }

    .install-error-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* Screen 3: Installation Complete Screen */
    .screen-complete {
      flex: 1;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      animation: fadeIn 0.3s cubic-bezier(0.2, 0, 0, 1) forwards;
    }

    .complete-hero-align {
      margin-left: 170px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .complete-title {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.6px;
      line-height: 1.1;
      color: #ffffff;
    }

    .complete-subtitle {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 8px;
      line-height: 1.4;
      max-width: 380px;
    }

    #uninstallOptions {
      background: var(--m3-surface-container);
      border: 1px solid var(--m3-outline-variant);
      border-radius: var(--m3-radius-sm);
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.05s !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient Layer with Pure Transparent SVG Pinwheel -->
  <div class="bg-artwork" data-tauri-drag-region>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" class="pinwheel-svg-bg" id="pinwheelBg">
      <g>
        <!-- Blade 1: Top-Right (0 deg) -->
        <g transform="rotate(0 54 54)">
          <path fill="#38BDF8" d="M 54,26 C 65,26 76,36 76,47 C 76,52 70,54 63,54 C 59,44 54,35 54,26 Z"/>
        </g>
        <!-- Blade 2: Bottom-Right (90 deg) -->
        <g transform="rotate(90 54 54)">
          <path fill="#60A5FA" d="M 54,26 C 65,26 76,36 76,47 C 76,52 70,54 63,54 C 59,44 54,35 54,26 Z"/>
        </g>
        <!-- Blade 3: Bottom-Left (180 deg) -->
        <g transform="rotate(180 54 54)">
          <path fill="#818CF8" d="M 54,26 C 65,26 76,36 76,47 C 76,52 70,54 63,54 C 59,44 54,35 54,26 Z"/>
        </g>
        <!-- Blade 4: Top-Left (270 deg) -->
        <g transform="rotate(270 54 54)">
          <path fill="#A78BFA" d="M 54,26 C 65,26 76,36 76,47 C 76,52 70,54 63,54 C 59,44 54,35 54,26 Z"/>
        </g>
        <!-- Radiant Center Core Circle -->
        <circle cx="54" cy="54" r="7" fill="#FFFFFF"/>
      </g>
    </svg>
    <div class="bg-white-overlay" data-tauri-drag-region></div>
  </div>

  <!-- Frameless Titlebar -->
  <div class="titlebar" data-tauri-drag-region>
    <div class="titlebar-drag" data-tauri-drag-region>
      <svg class="titlebar-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5 10 5 10-5-5-2.5-5 2.5z"/></svg>
      <span class="titlebar-text" id="windowTitle">Lumen Setup</span>
    </div>
    <div class="titlebar-controls">
      <button class="win-btn" id="btnMinimize" title="Minimize">
        <svg width="10" height="1" viewBox="0 0 10 1"><path fill="currentColor" d="M0 0h10v1H0z"/></svg>
      </button>
      <button class="win-btn close" id="btnClose" title="Close">
        <svg width="10" height="10" viewBox="0 0 10 10"><path fill="currentColor" d="M1 0L0 1l4 4-4 4 1 1 4-4 4 4 1-1-4-4 4-4-1-1-4 4-4-4z"/></svg>
      </button>
    </div>
  </div>

  <!-- Main View Area -->
  <div class="view-container">

    <!-- Screen 1: Welcome & Setup Screen -->
    <div class="screen" id="screenWelcome">
      <div class="hero-area" data-tauri-drag-region>
        <div class="hero-text-align">
          <div class="hero-title" id="heroTitle">
            Lumen <span class="version-tag">v1.1.0</span>
          </div>
          <div class="hero-subtitle" id="heroSubtitle">
            Unofficial desktop client for Google Photos
          </div>
        </div>
      </div>

      <!-- Custom Options Drawer -->
      <div class="custom-drawer" id="customDrawer">
        <span class="drawer-label">Install Location</span>
        <div class="drawer-row">
          <input type="text" class="drawer-input" id="installPathInput" readonly>
          <button class="btn-browse" id="btnBrowse">Browse...</button>
        </div>
        <div class="drawer-checkboxes">
          <label class="checkbox-label">
            <input type="checkbox" id="chkDesktopShortcut" checked>
            <span>Create desktop shortcut</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="chkStartupLaunch">
            <span>Start Lumen on system startup</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="chkLaunchAfter" checked>
            <span>Launch Lumen when finished</span>
          </label>
        </div>
      </div>

      <!-- Uninstall Options (Purge Checkbox) -->
      <div id="uninstallOptions" style="display: none; margin-bottom: 16px;">
        <label class="checkbox-label" style="font-size: 13px;">
          <input type="checkbox" id="chkPurgeConfig">
          <span>Also delete account configuration and cache (<code id="configPathLabel" style="font-family: monospace; color: var(--m3-primary);">%APPDATA%\Lumen</code>)</span>
        </label>
      </div>

      <!-- Bottom Actions: Fresh Setup -->
      <div class="bottom-actions" id="normalActions">
        <button class="btn-m3-tonal" id="btnToggleCustom">Customize</button>
        <button class="btn-m3-primary" id="btnMainInstall">Install</button>
      </div>

      <!-- Bottom Actions: Already Installed State -->
      <div class="bottom-actions" id="installedActions" style="display: none;">
        <button class="btn-m3-danger" id="btnGoUninstall" style="margin-right: auto;">Uninstall</button>
        <button class="btn-m3-tonal" id="btnRepair">Repair</button>
        <button class="btn-m3-tonal" id="btnToggleCustomInstalled">Customize</button>
        <button class="btn-m3-primary" id="btnLaunchExisting">Launch Lumen</button>
      </div>

      <!-- Bottom Actions: Uninstall Confirmation Screen -->
      <div class="bottom-actions" id="uninstallActions" style="display: none;">
        <button class="btn-m3-tonal" id="btnCancelUninstall" style="margin-right: auto;">Cancel</button>
        <button class="btn-m3-danger" id="btnConfirmUninstall">Uninstall</button>
      </div>
    </div>

    <!-- Screen 2: Installing with Material 3 Expressive Wavy Progress -->
    <div class="screen-installing" id="screenInstalling">
      <div class="installing-title" id="installingTitle">Installing Lumen...</div>
      <div class="installing-subtitle" id="installingSubtitle">Extracting application binaries...</div>

      <div class="m3-wavy-progress-wrapper" id="progressWrapper">
        <div class="m3-wavy-svg-box">
          <div class="wavy-track"></div>
          <div class="wavy-track-stop"></div>
          <div class="wavy-fill" id="wavyFill">
            <svg class="wavy-svg" viewBox="0 0 456 16">
              <path class="wavy-indicator" d="M 0 8 C 5.5 4.5, 13.5 4.5, 19.0 8 C 24.5 11.5, 32.5 11.5, 38.0 8 C 43.5 4.5, 51.5 4.5, 57.0 8 C 62.5 11.5, 70.5 11.5, 76.0 8 C 81.5 4.5, 89.5 4.5, 95.0 8 C 100.5 11.5, 108.5 11.5, 114.0 8 C 119.5 4.5, 127.5 4.5, 133.0 8 C 138.5 11.5, 146.5 11.5, 152.0 8 C 157.5 4.5, 165.5 4.5, 171.0 8 C 176.5 11.5, 184.5 11.5, 190.0 8 C 195.5 4.5, 203.5 4.5, 209.0 8 C 214.5 11.5, 222.5 11.5, 228.0 8 C 233.5 4.5, 241.5 4.5, 247.0 8 C 252.5 11.5, 260.5 11.5, 266.0 8 C 271.5 4.5, 279.5 4.5, 285.0 8 C 290.5 11.5, 298.5 11.5, 304.0 8 C 309.5 4.5, 317.5 4.5, 323.0 8 C 328.5 11.5, 336.5 11.5, 342.0 8 C 347.5 4.5, 355.5 4.5, 361.0 8 C 366.5 11.5, 374.5 11.5, 380.0 8 C 385.5 4.5, 393.5 4.5, 399.0 8 C 404.5 11.5, 412.5 11.5, 418.0 8 C 423.5 4.5, 431.5 4.5, 437.0 8 C 442.5 11.5, 450.5 11.5, 456.0 8" />
            </svg>
          </div>
        </div>
        <div class="progress-percent-label" id="progressPercentLabel">0%</div>
      </div>

      <!-- Installation Error Box -->
      <div class="install-error-box" id="installErrorBox" style="display: none;">
        <div class="install-error-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          <span id="installErrorTitle">Installation Problem</span>
        </div>
        <div class="install-error-text" id="installErrorText"></div>
        <div class="install-error-actions">
          <button class="btn-m3-tonal" id="btnCancelInstall">Close</button>
          <button class="btn-m3-primary" id="btnRetryInstall">Retry</button>
        </div>
      </div>
    </div>

    <!-- Screen 3: Installation Complete Screen -->
    <div class="screen-complete" id="screenComplete">
      <div class="hero-area" data-tauri-drag-region>
        <div class="complete-hero-align">
          <div class="complete-title" id="completeTitle">Installation Complete</div>
          <div class="complete-subtitle" id="completeSubtitle">
            Lumen has been installed to your computer and is ready for use.
          </div>
        </div>
      </div>

      <!-- Bottom Right: Checkbox + Finish Button -->
      <div class="bottom-actions">
        <label class="checkbox-label" id="finishLaunchWrapper">
          <input type="checkbox" id="chkFinishLaunch" checked>
          <span>Launch Lumen</span>
        </label>
        <button class="btn-m3-primary" id="btnFinishAction">Finish</button>
      </div>
    </div>

  </div>

  <script>
    const invoke = window.__TAURI__ ? window.__TAURI__.core.invoke : async () => {};

    let isUninstallMode = false;
    let isInstalledState = false;
    let installedTargetDir = "";

    // Window controls
    document.getElementById('btnMinimize').addEventListener('click', () => invoke('minimize_installer'));
    document.getElementById('btnClose').addEventListener('click', () => invoke('close_installer'));

    // Enable smooth native window dragging on non-interactive areas
    document.addEventListener('mousedown', (e) => {
      if (e.buttons === 1) {
        if (!e.target.closest('button, input, label, a, .custom-drawer, .bottom-actions')) {
          invoke('start_dragging');
        }
      }
    });

    // Drawer toggle
    const btnToggleCustom = document.getElementById('btnToggleCustom');
    const btnToggleCustomInstalled = document.getElementById('btnToggleCustomInstalled');
    const customDrawer = document.getElementById('customDrawer');

    function toggleCustomDrawer() {
      const isOpen = customDrawer.classList.toggle('expanded');
      const label = isOpen ? "Hide Options" : "Customize";
      if (btnToggleCustom) btnToggleCustom.textContent = label;
      if (btnToggleCustomInstalled) btnToggleCustomInstalled.textContent = label;
    }

    if (btnToggleCustom) btnToggleCustom.addEventListener('click', toggleCustomDrawer);
    if (btnToggleCustomInstalled) btnToggleCustomInstalled.addEventListener('click', toggleCustomDrawer);

    // M3 Expressive state-layer ripple for interactive buttons
    document.addEventListener('pointerdown', (e) => {
      const btn = e.target.closest('.btn-m3-primary, .btn-m3-tonal, .btn-m3-danger, .btn-browse');
      if (!btn) return;
      const rect = btn.getBoundingClientRect();
      const circle = document.createElement('span');
      const d = Math.max(rect.width, rect.height);
      circle.style.width = circle.style.height = `${d}px`;
      circle.style.left = `${e.clientX - rect.left - d / 2}px`;
      circle.style.top = `${e.clientY - rect.top - d / 2}px`;
      circle.classList.add('m3-ripple');
      btn.appendChild(circle);
      setTimeout(() => circle.remove(), 600);
    });

    // M3 Expressive screen transition helper
    function transitionScreens(fromEl, toEl, onMidpoint) {
      fromEl.classList.add('m3-screen-exit');
      document.body.classList.add('installing-active');
      setTimeout(() => {
        fromEl.style.display = 'none';
        fromEl.classList.remove('m3-screen-exit');
        toEl.style.display = 'flex';
        toEl.classList.add('m3-screen-enter');
        if (onMidpoint) onMidpoint();
        setTimeout(() => {
          toEl.classList.remove('m3-screen-enter');
        }, 550);
      }, 160);
    }

    // Sync chkLaunchAfter with chkFinishLaunch
    document.getElementById('chkLaunchAfter').addEventListener('change', (e) => {
      document.getElementById('chkFinishLaunch').checked = e.target.checked;
    });

    // Browse Directory
    document.getElementById('btnBrowse').addEventListener('click', async () => {
      try {
        const selected = await invoke('pick_directory');
        if (selected) {
          document.getElementById('installPathInput').value = selected;
        }
      } catch (err) {
        console.error("Failed to pick directory:", err);
      }
    });

    function switchToUninstallUI() {
      isUninstallMode = true;
      document.getElementById('windowTitle').textContent = "Lumen Uninstaller";
      document.getElementById('heroTitle').innerHTML = "Uninstall Lumen?";
      document.getElementById('heroSubtitle').textContent = "Remove Lumen and shortcuts from your computer";

      customDrawer.classList.remove('expanded');
      if (btnToggleCustom) btnToggleCustom.textContent = "Customize";
      if (btnToggleCustomInstalled) btnToggleCustomInstalled.textContent = "Customize";

      document.getElementById('normalActions').style.display = 'none';
      document.getElementById('installedActions').style.display = 'none';

      const purgeBox = document.getElementById('uninstallOptions');
      purgeBox.style.display = 'block';
      purgeBox.classList.remove('m3-shared-axis-enter');
      void purgeBox.offsetWidth;
      purgeBox.classList.add('m3-shared-axis-enter');

      const uActions = document.getElementById('uninstallActions');
      uActions.style.display = 'flex';
      uActions.classList.remove('m3-shared-axis-enter');
      void uActions.offsetWidth;
      uActions.classList.add('m3-shared-axis-enter');
    }

    function switchToInstalledUI() {
      isUninstallMode = false;
      document.getElementById('windowTitle').textContent = "Lumen Setup";
      document.getElementById('heroTitle').innerHTML = 'Lumen <span class="version-tag">Installed</span>';
      document.getElementById('heroSubtitle').textContent = "Lumen is installed on your computer. Choose an action below.";

      customDrawer.classList.remove('expanded');
      if (btnToggleCustom) btnToggleCustom.textContent = "Customize";
      if (btnToggleCustomInstalled) btnToggleCustomInstalled.textContent = "Customize";

      document.getElementById('uninstallOptions').style.display = 'none';
      document.getElementById('uninstallActions').style.display = 'none';
      document.getElementById('normalActions').style.display = 'none';

      const instActions = document.getElementById('installedActions');
      instActions.style.display = 'flex';
      instActions.classList.remove('m3-shared-axis-enter');
      void instActions.offsetWidth;
      instActions.classList.add('m3-shared-axis-enter');
    }

    function switchToFreshInstallUI() {
      isUninstallMode = false;
      document.getElementById('windowTitle').textContent = "Lumen Setup";
      document.getElementById('heroTitle').innerHTML = 'Lumen <span class="version-tag">v1.1.0</span>';
      document.getElementById('heroSubtitle').textContent = "Unofficial desktop client for Google Photos";

      customDrawer.classList.remove('expanded');
      if (btnToggleCustom) btnToggleCustom.textContent = "Customize";
      if (btnToggleCustomInstalled) btnToggleCustomInstalled.textContent = "Customize";

      document.getElementById('uninstallOptions').style.display = 'none';
      document.getElementById('uninstallActions').style.display = 'none';
      document.getElementById('installedActions').style.display = 'none';

      const normActions = document.getElementById('normalActions');
      normActions.style.display = 'flex';
      normActions.classList.remove('m3-shared-axis-enter');
      void normActions.offsetWidth;
      normActions.classList.add('m3-shared-axis-enter');
    }

    // Initialize
    async function init() {
      try {
        const info = await invoke('get_setup_info');
        isUninstallMode = info.is_uninstall;
        isInstalledState = info.is_installed;
        installedTargetDir = info.default_path;

        if (info.config_path) {
          const configLabel = document.getElementById('configPathLabel');
          if (configLabel) configLabel.textContent = info.config_path;
        }

        if (isUninstallMode) {
          switchToUninstallUI();
        } else if (info.is_installed) {
          document.getElementById('installPathInput').value = info.default_path;
          switchToInstalledUI();
        } else {
          document.getElementById('installPathInput').value = info.default_path;
          switchToFreshInstallUI();
        }
      } catch (err) {
        console.error("Init error:", err);
      } finally {
        await invoke('show_window');
      }
    }

    // Installed Actions handlers
    document.getElementById('btnLaunchExisting').addEventListener('click', async () => {
      await invoke('launch_app', { targetDir: installedTargetDir });
      await invoke('close_installer');
    });

    document.getElementById('btnRepair').addEventListener('click', () => {
      const desktopShortcut = document.getElementById('chkDesktopShortcut').checked;
      const launchOnStartup = document.getElementById('chkStartupLaunch').checked;

      transitionScreens(
        document.getElementById('screenWelcome'),
        document.getElementById('screenInstalling'),
        () => {
          document.getElementById('installingTitle').textContent = "Repairing Lumen...";
          document.getElementById('installingSubtitle').textContent = "Restoring application binaries...";
          performInstall(installedTargetDir, desktopShortcut, launchOnStartup);
        }
      );
    });

    // Uninstall Screen handlers
    document.getElementById('btnGoUninstall').addEventListener('click', () => {
      switchToUninstallUI();
    });

    document.getElementById('btnCancelUninstall').addEventListener('click', () => {
      if (isInstalledState) {
        switchToInstalledUI();
      } else {
        invoke('close_installer');
      }
    });

    document.getElementById('btnConfirmUninstall').addEventListener('click', () => {
      executeUninstallFlow();
    });

    function executeUninstallFlow() {
      const purge = document.getElementById('chkPurgeConfig') ? document.getElementById('chkPurgeConfig').checked : false;

      transitionScreens(
        document.getElementById('screenWelcome'),
        document.getElementById('screenInstalling'),
        () => {
          document.getElementById('installingTitle').textContent = "Uninstalling Lumen...";
          document.getElementById('installingSubtitle').textContent = "Removing application files and shortcuts...";
          performUninstall(purge);
        }
      );
    }

    // Error Box handlers
    function showProgressError(err, isUninstall) {
      const progressWrapper = document.getElementById('progressWrapper');
      if (progressWrapper) progressWrapper.style.display = 'none';

      const titleEl = document.getElementById('installingTitle');
      const subEl = document.getElementById('installingSubtitle');
      const errTitle = document.getElementById('installErrorTitle');
      const retryBtn = document.getElementById('btnRetryInstall');
      const errBox = document.getElementById('installErrorBox');
      const errText = document.getElementById('installErrorText');

      if (isUninstall) {
        if (titleEl) titleEl.textContent = "Uninstallation Problem";
        if (subEl) subEl.textContent = "Unable to finish removing all program files.";
        if (errTitle) errTitle.textContent = "Uninstallation Problem";
        if (retryBtn) retryBtn.style.display = 'none';
      } else {
        if (titleEl) titleEl.textContent = "Installation Problem";
        if (subEl) subEl.textContent = "Unable to finish copying or registering files.";
        if (errTitle) errTitle.textContent = "Installation Problem";
        if (retryBtn) retryBtn.style.display = 'inline-flex';
      }
      if (errText) errText.textContent = String(err || "An unexpected error occurred.");
      if (errBox) errBox.style.display = 'flex';
    }

    document.getElementById('btnRetryInstall').addEventListener('click', async () => {
      document.getElementById('installErrorBox').style.display = 'none';
      document.getElementById('progressWrapper').style.display = 'flex';
      document.getElementById('installingTitle').textContent = "Installing Lumen...";
      document.getElementById('installingSubtitle').textContent = "Extracting application binaries...";
      const targetDir = document.getElementById('installPathInput').value || installedTargetDir;
      const desktopShortcut = document.getElementById('chkDesktopShortcut').checked;
      const launchOnStartup = document.getElementById('chkStartupLaunch').checked;
      await performInstall(targetDir, desktopShortcut, launchOnStartup);
    });

    document.getElementById('btnCancelInstall').addEventListener('click', () => {
      invoke('close_installer');
    });

    // Main install button click (Fresh Setup)
    document.getElementById('btnMainInstall').addEventListener('click', () => {
      const targetDir = document.getElementById('installPathInput').value || installedTargetDir;
      installedTargetDir = targetDir;
      const desktopShortcut = document.getElementById('chkDesktopShortcut').checked;
      const launchOnStartup = document.getElementById('chkStartupLaunch').checked;

      transitionScreens(
        document.getElementById('screenWelcome'),
        document.getElementById('screenInstalling'),
        () => {
          document.getElementById('installingTitle').textContent = "Installing Lumen...";
          document.getElementById('installingSubtitle').textContent = "Extracting application binaries...";
          performInstall(targetDir, desktopShortcut, launchOnStartup);
        }
      );
    });

    // Update the Wavy Progress Bar
    function setProgress(pct, statusText) {
      if (statusText) {
        document.getElementById('installingSubtitle').textContent = statusText;
      }
      const fill = document.getElementById('wavyFill');
      if (fill) {
        const clamped = Math.max(0, Math.min(100, pct));
        fill.style.width = clamped + "%";
      }
      document.getElementById('progressPercentLabel').textContent = pct + "%";
    }

    async function performInstall(targetDir, createShortcut, launchOnStartup) {
      const errBox = document.getElementById('installErrorBox');
      if (errBox) errBox.style.display = 'none';
      const progressWrapper = document.getElementById('progressWrapper');
      if (progressWrapper) progressWrapper.style.display = 'flex';
      setProgress(25, "Extracting application binaries...");
      try {
        await invoke('start_install', {
          targetDir,
          createDesktopShortcut: createShortcut,
          launchOnStartup: Boolean(launchOnStartup),
          launchAfter: false // handled by Finish button
        });

        setProgress(75, "Creating shortcuts & registering app...");

        setTimeout(() => {
          setProgress(100, "Finishing setup...");
          setTimeout(() => {
            transitionScreens(
              document.getElementById('screenInstalling'),
              document.getElementById('screenComplete'),
              () => {
                document.body.classList.remove('installing-active');
              }
            );

            const finishBtn = document.getElementById('btnFinishAction');
            finishBtn.onclick = async () => {
              const shouldLaunch = document.getElementById('chkFinishLaunch').checked;
              if (shouldLaunch) {
                await invoke('launch_app', { targetDir: installedTargetDir });
              }
              await invoke('close_installer');
            };
          }, 600);
        }, 600);

      } catch (err) {
        showProgressError(err, false);
      }
    }

    async function performUninstall(purgeConfig) {
      const errBox = document.getElementById('installErrorBox');
      if (errBox) errBox.style.display = 'none';
      const progressWrapper = document.getElementById('progressWrapper');
      if (progressWrapper) progressWrapper.style.display = 'flex';
      setProgress(35, "Removing application shortcuts...");
      try {
        await invoke('start_uninstall', { purgeConfig });
        setProgress(75, "Cleaning up registry and program files...");

        setTimeout(() => {
          setProgress(100, "Removal complete");
          setTimeout(() => {
            transitionScreens(
              document.getElementById('screenInstalling'),
              document.getElementById('screenComplete'),
              () => {
                document.body.classList.remove('installing-active');
                document.getElementById('completeTitle').textContent = "Uninstalled Successfully";
                document.getElementById('completeSubtitle').textContent = "Lumen has been completely removed from your PC.";
                document.getElementById('finishLaunchWrapper').style.display = 'none';

                const finishBtn = document.getElementById('btnFinishAction');
                finishBtn.textContent = "Close";
                finishBtn.onclick = () => invoke('close_installer');
              }
            );
          }, 600);
        }, 600);

      } catch (err) {
        showProgressError(err, true);
      }
    }

    init();
  </script>
</body>
</html>
