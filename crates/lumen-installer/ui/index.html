<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen Setup</title>
  <style>
    :root {
      --m3-surface: #131316;
      --m3-surface-container: #1d1e22;
      --m3-surface-container-high: #292a30;
      --m3-surface-container-highest: #34353d;
      --m3-primary: #a8c7fa;
      --m3-on-primary: #042f6e;
      --m3-primary-container: #0842a0;
      --m3-on-primary-container: #d3e3fd;
      --m3-secondary-container: #33445c;
      --m3-on-secondary-container: #d7e3f8;
      --m3-error: #f2b8b5;
      --m3-on-error: #601410;
      --m3-on-surface: #e3e2e6;
      --m3-on-surface-variant: #c4c6d0;
      --m3-outline: #8e9099;
      --m3-outline-variant: rgba(255, 255, 255, 0.12);
      --m3-radius-sm: 8px;
      --m3-radius-md: 16px;
      --m3-radius-lg: 24px;
      --m3-radius-full: 9999px;
      --m3-font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--m3-surface);
      color: var(--m3-on-surface);
      font-family: var(--m3-font);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--m3-outline-variant);
      border-radius: var(--m3-radius-lg);
      position: relative;
    }

    /* Background Artwork */
    .bg-artwork {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .bg-logo {
      position: absolute;
      left: -50px;
      top: 50%;
      transform: translateY(-50%);
      width: 340px;
      height: 340px;
      opacity: 0.20;
      filter: drop-shadow(0 0 40px rgba(168, 199, 250, 0.35));
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .bg-white-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 65%, transparent 100%),
                  linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(0, 0, 0, 0.25) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* Window Titlebar */
    .titlebar {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 10;
      cursor: default;
    }

    .titlebar-drag {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      height: 100%;
    }

    .titlebar-icon {
      width: 16px;
      height: 16px;
      fill: var(--m3-primary);
    }

    .titlebar-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--m3-on-surface-variant);
      letter-spacing: 0.2px;
    }

    .titlebar-controls {
      display: flex;
      gap: 4px;
    }

    .win-btn {
      width: 28px;
      height: 28px;
      border-radius: var(--m3-radius-sm);
      border: none;
      background: transparent;
      color: var(--m3-on-surface-variant);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .win-btn:hover {
      background: var(--m3-surface-container-high);
      color: var(--m3-on-surface);
    }

    .win-btn.close:hover {
      background: #e81123;
      color: #ffffff;
    }

    /* Main View Container */
    .view-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 5;
      padding: 12px 32px 28px 32px;
      overflow: hidden;
    }

    /* View 1: Welcome & Setup */
    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      animation: fadeIn 0.3s cubic-bezier(0.2, 0, 0, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-split {
      display: flex;
      align-items: center;
      height: 200px;
      position: relative;
    }

    .hero-text-block {
      margin-left: 170px;
      z-index: 2;
    }

    .hero-title {
      font-size: 46px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.1;
      color: #ffffff;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .version-tag {
      font-size: 13px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: var(--m3-radius-full);
      background: rgba(168, 199, 250, 0.15);
      color: var(--m3-primary);
      border: 1px solid rgba(168, 199, 250, 0.25);
      vertical-align: middle;
    }

    .hero-subtitle {
      font-size: 15px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.72);
      margin-top: 6px;
      line-height: 1.4;
      max-width: 360px;
    }

    /* Center Action Area */
    .center-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .btn-m3-primary {
      background: var(--m3-primary);
      color: var(--m3-on-primary);
      border: none;
      border-radius: var(--m3-radius-full);
      height: 48px;
      padding: 0 40px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(168, 199, 250, 0.25);
      transition: background 0.2s cubic-bezier(0.2, 0, 0, 1),
                  transform 0.15s cubic-bezier(0.2, 0, 0, 1),
                  border-radius 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .btn-m3-primary:hover {
      background: #c3d9fb;
      box-shadow: 0 6px 20px rgba(168, 199, 250, 0.35);
      border-radius: 20px;
    }

    .btn-m3-primary:active {
      transform: scale(0.97);
      border-radius: 16px;
    }

    .btn-m3-danger {
      background: var(--m3-error);
      color: var(--m3-on-error);
      border: none;
      border-radius: var(--m3-radius-full);
      height: 48px;
      padding: 0 36px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s, border-radius 0.2s;
    }

    .btn-m3-danger:hover {
      background: #f7d2d0;
      border-radius: 20px;
    }

    .btn-m3-danger:active {
      transform: scale(0.97);
      border-radius: 16px;
    }

    .btn-m3-text {
      background: transparent;
      color: var(--m3-on-surface-variant);
      border: none;
      border-radius: var(--m3-radius-full);
      height: 32px;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, color 0.15s;
    }

    .btn-m3-text:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--m3-on-surface);
    }

    .btn-m3-text svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .btn-m3-text.open svg {
      transform: rotate(180deg);
    }

    /* Custom Options Drawer */
    .custom-drawer {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      background: var(--m3-surface-container);
      border: 1px solid var(--m3-outline-variant);
      border-radius: var(--m3-radius-md);
      padding: 0 16px;
      margin-top: 6px;
      transition: max-height 0.3s cubic-bezier(0.2, 0, 0, 1),
                  opacity 0.25s cubic-bezier(0.2, 0, 0, 1),
                  padding 0.3s cubic-bezier(0.2, 0, 0, 1);
    }

    .custom-drawer.expanded {
      max-height: 160px;
      opacity: 1;
      padding: 14px 16px;
    }

    .drawer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .drawer-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--m3-on-surface-variant);
      margin-bottom: 4px;
      display: block;
    }

    .drawer-input {
      flex: 1;
      background: var(--m3-surface-container-high);
      border: 1px solid var(--m3-outline-variant);
      border-radius: var(--m3-radius-sm);
      height: 34px;
      padding: 0 10px;
      font-size: 12px;
      color: var(--m3-on-surface);
      outline: none;
      font-family: inherit;
    }

    .drawer-input:focus {
      border-color: var(--m3-primary);
    }

    .btn-browse {
      background: var(--m3-surface-container-highest);
      color: var(--m3-on-surface);
      border: 1px solid var(--m3-outline-variant);
      border-radius: var(--m3-radius-sm);
      height: 34px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }

    .btn-browse:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .drawer-checkboxes {
      display: flex;
      gap: 20px;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--m3-on-surface-variant);
      cursor: pointer;
    }

    .checkbox-label input {
      accent-color: var(--m3-primary);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    /* Screen 2: Installing View */
    .screen-installing {
      flex: 1;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 20px;
      animation: fadeIn 0.3s cubic-bezier(0.2, 0, 0, 1) forwards;
    }

    .installing-title {
      font-size: 26px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .installing-subtitle {
      font-size: 13px;
      color: var(--m3-on-surface-variant);
      margin-top: 4px;
      min-height: 18px;
    }

    /* Material 3 Expressive Squiggly Wave Progress Indicator */
    .m3-wavy-progress-wrapper {
      width: 380px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .m3-wavy-svg-box {
      width: 100%;
      height: 24px;
      position: relative;
      overflow: hidden;
      border-radius: var(--m3-radius-full);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .wavy-track {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-50%);
    }

    .wavy-wave-container {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      overflow: hidden;
      transition: width 0.35s cubic-bezier(0.2, 0, 0, 1);
    }

    .wavy-svg {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 500px;
      animation: wavyFlow 1.6s linear infinite;
    }

    @keyframes wavyFlow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-48px); }
    }

    .wavy-path {
      fill: none;
      stroke: var(--m3-primary);
      stroke-width: 3.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(168, 199, 250, 0.6));
    }

    .wavy-stop-dot {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--m3-primary);
      box-shadow: 0 0 8px rgba(168, 199, 250, 0.8);
    }

    .progress-percent-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--m3-on-surface-variant);
      letter-spacing: 0.5px;
    }

    /* Screen 3: Installation Complete */
    .screen-complete {
      flex: 1;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      animation: fadeIn 0.3s cubic-bezier(0.2, 0, 0, 1) forwards;
    }

    .complete-content-block {
      margin-left: 170px;
      margin-top: 40px;
    }

    .complete-title {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.15;
      color: #ffffff;
    }

    .complete-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 10px;
      line-height: 1.5;
      max-width: 360px;
    }

    /* Bottom-Right Corner Action */
    .bottom-right-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-top: 12px;
    }
  </style>
</head>
<body>
  <!-- Ambient Artwork Layer -->
  <div class="bg-artwork" data-tauri-drag-region>
    <img src="appicon.png" class="bg-logo" id="bgLogo" alt="" draggable="false">
    <div class="bg-white-overlay" data-tauri-drag-region></div>
  </div>

  <!-- Frameless Titlebar -->
  <div class="titlebar" data-tauri-drag-region>
    <div class="titlebar-drag" data-tauri-drag-region>
      <svg class="titlebar-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5 10 5 10-5-5-2.5-5 2.5z"/></svg>
      <span class="titlebar-text" id="windowTitle">Lumen Setup</span>
    </div>
    <div class="titlebar-controls">
      <button class="win-btn" id="btnMinimize" title="Minimize">
        <svg width="10" height="1" viewBox="0 0 10 1"><path fill="currentColor" d="M0 0h10v1H0z"/></svg>
      </button>
      <button class="win-btn close" id="btnClose" title="Close">
        <svg width="10" height="10" viewBox="0 0 10 10"><path fill="currentColor" d="M1 0L0 1l4 4-4 4 1 1 4-4 4 4 1-1-4-4 4-4-1-1-4 4-4-4z"/></svg>
      </button>
    </div>
  </div>

  <!-- Main View Area -->
  <div class="view-container">

    <!-- Screen 1: Welcome & Setup Screen -->
    <div class="screen" id="screenWelcome">
      <div class="hero-split" data-tauri-drag-region>
        <div class="hero-text-block">
          <div class="hero-title" id="heroTitle">
            Lumen <span class="version-tag">v1.1.0</span>
          </div>
          <div class="hero-subtitle" id="heroSubtitle">
            Unofficial desktop client for Google Photos
          </div>
        </div>
      </div>

      <!-- Center Action Area with Customize Drawer -->
      <div class="center-actions">
        <button class="btn-m3-primary" id="btnMainInstall">Install</button>
        <button class="btn-m3-text" id="btnToggleCustom">
          <span>Customize</span>
          <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
        </button>

        <!-- Custom Options Drawer -->
        <div class="custom-drawer" id="customDrawer">
          <span class="drawer-label">Install Location</span>
          <div class="drawer-row">
            <input type="text" class="drawer-input" id="installPathInput" readonly>
            <button class="btn-browse" id="btnBrowse">Browse...</button>
          </div>
          <div class="drawer-checkboxes">
            <label class="checkbox-label">
              <input type="checkbox" id="chkDesktopShortcut" checked>
              <span>Create desktop shortcut</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="chkLaunchAfter" checked>
              <span>Launch Lumen when finished</span>
            </label>
          </div>
        </div>

        <!-- Uninstall Checkbox (Only displayed in uninstall mode) -->
        <div id="uninstallOptions" style="display: none; margin-top: 8px;">
          <label class="checkbox-label">
            <input type="checkbox" id="chkPurgeConfig">
            <span>Also delete local account configuration and cache (<code style="font-family: monospace; color: var(--m3-primary);">~/.config/lumen</code>)</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Screen 2: Installing with Material 3 Expressive Wavy Progress -->
    <div class="screen-installing" id="screenInstalling">
      <div class="installing-title" id="installingTitle">Installing Lumen...</div>
      <div class="installing-subtitle" id="installingSubtitle">Extracting application binaries...</div>

      <div class="m3-wavy-progress-wrapper">
        <div class="m3-wavy-svg-box">
          <div class="wavy-track"></div>
          <div class="wavy-wave-container" id="wavyWaveContainer">
            <svg class="wavy-svg" viewBox="0 0 480 24" preserveAspectRatio="none">
              <!-- Sinusoidal wave repeating every 48 units -->
              <path class="wavy-path" d="
                M 0 12
                Q 12 3, 24 12 T 48 12
                Q 60 3, 72 12 T 96 12
                Q 108 3, 120 12 T 144 12
                Q 156 3, 168 12 T 192 12
                Q 204 3, 216 12 T 240 12
                Q 252 3, 264 12 T 288 12
                Q 300 3, 312 12 T 336 12
                Q 348 3, 360 12 T 384 12
                Q 396 3, 408 12 T 432 12
                Q 444 3, 456 12 T 480 12
              "/>
            </svg>
            <div class="wavy-stop-dot"></div>
          </div>
        </div>
        <div class="progress-percent-label" id="progressPercentLabel">0%</div>
      </div>
    </div>

    <!-- Screen 3: Installation Complete Screen -->
    <div class="screen-complete" id="screenComplete">
      <div class="complete-content-block" data-tauri-drag-region>
        <div class="complete-title" id="completeTitle">Installation Complete</div>
        <div class="complete-subtitle" id="completeSubtitle">
          Lumen has been installed to your computer and is ready for use.
        </div>
      </div>

      <!-- Button at the bottom-right corner -->
      <div class="bottom-right-footer">
        <button class="btn-m3-primary" id="btnCompleteAction">Launch Lumen</button>
      </div>
    </div>

  </div>

  <script>
    const invoke = window.__TAURI__ ? window.__TAURI__.core.invoke : async () => {};

    let isUninstallMode = false;
    let installedTargetDir = "";
    let shouldLaunchAfter = true;

    // Window controls
    document.getElementById('btnMinimize').addEventListener('click', () => invoke('minimize_installer'));
    document.getElementById('btnClose').addEventListener('click', () => invoke('close_installer'));

    // Drawer toggle
    const btnToggleCustom = document.getElementById('btnToggleCustom');
    const customDrawer = document.getElementById('customDrawer');
    btnToggleCustom.addEventListener('click', () => {
      const isOpen = customDrawer.classList.toggle('expanded');
      btnToggleCustom.classList.toggle('open', isOpen);
    });

    // Browse Directory
    document.getElementById('btnBrowse').addEventListener('click', async () => {
      try {
        const selected = await invoke('pick_directory');
        if (selected) {
          document.getElementById('installPathInput').value = selected;
        }
      } catch (err) {
        console.error("Failed to pick directory:", err);
      }
    });

    // Initialize
    async function init() {
      try {
        const info = await invoke('get_setup_info');
        isUninstallMode = info.is_uninstall;
        installedTargetDir = info.default_path;

        if (isUninstallMode) {
          document.getElementById('windowTitle').textContent = "Lumen Uninstaller";
          document.getElementById('heroTitle').innerHTML = "Uninstall Lumen";
          document.getElementById('heroSubtitle').textContent = "Remove Lumen and shortcuts from your computer";
          document.getElementById('btnToggleCustom').style.display = 'none';
          document.getElementById('customDrawer').style.display = 'none';
          document.getElementById('uninstallOptions').style.display = 'block';

          const btn = document.getElementById('btnMainInstall');
          btn.textContent = "Uninstall";
          btn.className = "btn-m3-danger";
        } else {
          document.getElementById('installPathInput').value = info.default_path;
        }
      } catch (err) {
        console.error("Init error:", err);
      }
    }

    // Main action button click
    document.getElementById('btnMainInstall').addEventListener('click', async () => {
      // Transition to Screen 2 (Installing)
      document.getElementById('screenWelcome').style.display = 'none';
      document.getElementById('screenInstalling').style.display = 'flex';

      if (isUninstallMode) {
        document.getElementById('installingTitle').textContent = "Uninstalling Lumen...";
        document.getElementById('installingSubtitle').textContent = "Removing application files and shortcuts...";
        const purge = document.getElementById('chkPurgeConfig').checked;
        await performUninstall(purge);
      } else {
        const targetDir = document.getElementById('installPathInput').value;
        installedTargetDir = targetDir;
        const desktopShortcut = document.getElementById('chkDesktopShortcut').checked;
        shouldLaunchAfter = document.getElementById('chkLaunchAfter').checked;
        await performInstall(targetDir, desktopShortcut, shouldLaunchAfter);
      }
    });

    // Update the Wavy Progress Bar
    function setProgress(pct, statusText) {
      if (statusText) {
        document.getElementById('installingSubtitle').textContent = statusText;
      }
      document.getElementById('wavyWaveContainer').style.width = pct + "%";
      document.getElementById('progressPercentLabel').textContent = pct + "%";
    }

    async function performInstall(targetDir, createShortcut, launchAfter) {
      setProgress(25, "Extracting application binaries...");
      try {
        await invoke('start_install', {
          targetDir,
          createDesktopShortcut: createShortcut,
          launchAfter: false // We will handle launch in the final button
        });

        setProgress(75, "Creating shortcuts & registering app...");

        setTimeout(() => {
          setProgress(100, "Finishing setup...");
          setTimeout(() => {
            // Transition to Screen 3 (Complete)
            document.getElementById('screenInstalling').style.display = 'none';
            document.getElementById('screenComplete').style.display = 'flex';

            const completeBtn = document.getElementById('btnCompleteAction');
            if (launchAfter) {
              completeBtn.textContent = "Launch Lumen";
              completeBtn.onclick = async () => {
                await invoke('launch_app', { targetDir: installedTargetDir });
                await invoke('close_installer');
              };
            } else {
              completeBtn.textContent = "Finish";
              completeBtn.onclick = () => invoke('close_installer');
            }
          }, 600);
        }, 600);

      } catch (err) {
        alert("Installation failed: " + err);
        invoke('close_installer');
      }
    }

    async function performUninstall(purgeConfig) {
      setProgress(35, "Removing application shortcuts...");
      try {
        await invoke('start_uninstall', { purgeConfig });
        setProgress(75, "Cleaning up registry and program files...");

        setTimeout(() => {
          setProgress(100, "Removal complete");
          setTimeout(() => {
            document.getElementById('screenInstalling').style.display = 'none';
            document.getElementById('screenComplete').style.display = 'flex';

            document.getElementById('completeTitle').textContent = "Uninstalled Successfully";
            document.getElementById('completeSubtitle').textContent = "Lumen has been completely removed from your PC.";

            const completeBtn = document.getElementById('btnCompleteAction');
            completeBtn.textContent = "Close";
            completeBtn.onclick = () => invoke('close_installer');
          }, 600);
        }, 600);

      } catch (err) {
        alert("Uninstall failed: " + err);
        invoke('close_installer');
      }
    }

    init();
  </script>
</body>
</html>
