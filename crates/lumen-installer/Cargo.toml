[package]
name = "lumen-installer"
version = "2.0.1"
edition = "2021"

[[bin]]
name = "lumen-installer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
flate2 = "1.0"
tar = "0.4"

[dependencies]
tauri = { version = "2.12.5", features = ["image-png"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
flate2 = "1.0"
tar = "0.4"
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
