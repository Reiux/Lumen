[package]
name = "lumen-core"
version = "1.1.1"
edition = "2021"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
prost = "0.13"
rusqlite = { version = "0.33", features = ["bundled"] }
notify = "8.0"
keyring = { version = "3.6", default-features = false, features = ["linux-native"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha1 = "0.10"
base64 = "0.22"
directories = "6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
url = "2.5"
regex = "1.11"
async-trait = "0.1"
futures-util = "0.3"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.17"

[build-dependencies]
prost-build = "0.13"
