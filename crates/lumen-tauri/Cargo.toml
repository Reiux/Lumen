[package]
name = "lumen-tauri"
version = "1.1.1"
edition = "2021"

[[bin]]
name = "lumen"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
lumen-core = { path = "../lumen-core" }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.0"
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
futures-util = "0.3"
tempfile = "3.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
anyhow = "1.0"
url = "2.5"
tauri-plugin-single-instance = "2"
notify = "8.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
