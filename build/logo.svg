<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1E22"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Soft Drop Shadow -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#squircleBg)" filter="url(#dropShadow)"/>

  <!-- Subtle Inner Rim Light -->
  <rect x="101" y="101" width="822" height="822" rx="189" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.10"/>

  <!-- Lumen Aperture Pinwheel Blades -->
  <g transform="translate(512, 512) scale(9.5) translate(-54, -54)">
    <g transform="rotate(0 54 54)"><path fill="#38BDF8" d="M 54,26 C 65,26 76,36 76,47 C 76,52 70,54 63,54 C 59,44 54,35 54,26 Z"/></g>
    <g transform="rotate(90 54 54)"><path fill="#60A5FA" d="M 54,26 C 65,26 76,36 76,47 C 76,52 70,54 63,54 C 59,44 54,35 54,26 Z"/></g>
    <g transform="rotate(180 54 54)"><path fill="#818CF8" d="M 54,26 C 65,26 76,36 76,47 C 76,52 70,54 63,54 C 59,44 54,35 54,26 Z"/></g>
    <g transform="rotate(270 54 54)"><path fill="#A78BFA" d="M 54,26 C 65,26 76,36 76,47 C 76,52 70,54 63,54 C 59,44 54,35 54,26 Z"/></g>
    <circle cx="54" cy="54" r="7" fill="#FFFFFF"/>
  </g>
</svg>